<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="590" viewBox="0 0 1500 590"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">규칙을 직접 작성할까, 데이터에서 관계를 학습할까?</text>
<rect x="80" y="105" width="570" height="390" rx="20" class="soft"/><text x="365" y="143" text-anchor="middle" class="h">Rule-based</text><text x="365" y="170" text-anchor="middle" class="s">사람이 판단 규칙을 작성</text>
<rect x="140" y="190" width="190" height="145" rx="12" class="soft"/><text x="235" y="230" text-anchor="middle" class="h">Image</text><path d="M350 265H415" class="arrow"/><rect x="435" y="175" width="165" height="180" rx="12" class="blue"/><text x="517" y="220" text-anchor="middle" class="xs">if brightness &gt; 100</text><text x="517" y="250" text-anchor="middle" class="xs">and area &gt; 50</text><text x="517" y="295" text-anchor="middle" class="m">rule</text><text x="517" y="325" text-anchor="middle" class="h">Abnormal</text>
<rect x="850" y="105" width="570" height="390" rx="20" class="soft"/><text x="1135" y="143" text-anchor="middle" class="h">Machine Learning</text><text x="1135" y="170" text-anchor="middle" class="s">Data + Label로 Weight를 학습</text>
<rect x="905" y="190" width="155" height="145" rx="12" class="soft"/><text x="982" y="230" text-anchor="middle" class="h">Images</text><text x="982" y="265" text-anchor="middle" class="s">+ Labels</text><path d="M1080 265H1140" class="arrow"/><rect x="1160" y="175" width="190" height="180" rx="12" class="blue"/><text x="1255" y="225" text-anchor="middle" class="m">Training</text><text x="1255" y="260" text-anchor="middle" class="xs">Weight를 반복 조정</text><text x="1255" y="320" text-anchor="middle" class="h">Prediction</text>
<text x="365" y="545" text-anchor="middle" class="s">명확한 조건에는 강력하지만, 복잡한 시각 문제에서는 규칙이 빠르게 늘어납니다.</text><text x="1135" y="545" text-anchor="middle" class="s">사람이 모든 시각 규칙을 직접 쓰지 않고, 데이터에서 유용한 관계를 찾습니다.</text></svg>