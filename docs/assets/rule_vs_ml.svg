<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Rule-based 방식과 Machine Learning 방식 비교">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" rx="28" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#17243b">규칙을 사람이 직접 만들 수도 있고, 데이터에서 학습할 수도 있습니다</text>
<text x="60" y="100" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">현장에서는 두 방식을 함께 쓰기도 하며, 어떤 방식이든 실제 조건에서 검증해야 합니다.</text>

<g transform="translate(65 155)" font-family="Arial, Noto Sans KR, sans-serif">
  <rect width="500" height="350" rx="22" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
  <text x="28" y="48" font-size="25" font-weight="700" fill="#17243b">Rule-based</text>
  <text x="28" y="80" font-size="18" fill="#64748b">사람이 판단 규칙을 직접 작성</text>
  <rect x="35" y="120" width="125" height="70" rx="12" fill="#eef2ff"/><text x="98" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#4338ca">Input</text>
  <rect x="190" y="120" width="125" height="70" rx="12" fill="#fff7ed"/><text x="252" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">if 밝기 &lt; 100</text><text x="252" y="174" text-anchor="middle" font-size="16" fill="#9a3412">→ 후보</text>
  <rect x="345" y="120" width="120" height="70" rx="12" fill="#ecfdf5"/><text x="405" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">Result</text>
  <path d="M164 155H181M319 155H336" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  <text x="35" y="245" font-size="18" font-weight="700" fill="#334155">잘 맞는 경우</text>
  <text x="35" y="278" font-size="17" fill="#64748b">조건이 명확하고 설명 가능한 문제</text>
  <text x="35" y="314" font-size="17" fill="#64748b">예: 임계값, 안전 규칙, 간단한 Filtering</text>
</g>

<g transform="translate(635 155)" font-family="Arial, Noto Sans KR, sans-serif">
  <rect width="500" height="350" rx="22" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
  <text x="28" y="48" font-size="25" font-weight="700" fill="#17243b">Machine Learning</text>
  <text x="28" y="80" font-size="18" fill="#64748b">데이터에서 Weight를 학습</text>
  <rect x="35" y="120" width="125" height="70" rx="12" fill="#eef2ff"/><text x="98" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#4338ca">Image</text><text x="98" y="175" text-anchor="middle" font-size="16" fill="#64748b">+ Label</text>
  <rect x="190" y="120" width="125" height="70" rx="12" fill="#eff6ff"/><text x="252" y="162" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">Model</text>
  <rect x="345" y="120" width="120" height="70" rx="12" fill="#ecfdf5"/><text x="405" y="151" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Normal /</text><text x="405" y="175" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">Abnormal</text>
  <path d="M164 155H181M319 155H336" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  <text x="35" y="245" font-size="18" font-weight="700" fill="#334155">잘 맞는 경우</text>
  <text x="35" y="278" font-size="17" fill="#64748b">규칙을 사람이 직접 쓰기 어려운 패턴</text>
  <text x="35" y="314" font-size="17" fill="#64748b">예: 복잡한 이미지 분류, 검출, 분할</text>
</g>
</svg>