<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560"><rect width="100%" height="100%" fill="#fff"/><style>.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">정답 Label의 유무가 학습 방식의 출발점을 바꿉니다</text>
<rect x="100" y="110" width="540" height="330" rx="20" class="blue"/><text x="370" y="148" text-anchor="middle" class="h">지도학습</text><text x="370" y="175" text-anchor="middle" class="s">Input + 정답 Label</text>
<rect x="175" y="205" width="120" height="80" rx="12" fill="#cbd5e1"/><circle cx="260" cy="225" r="11" fill="#ef4444"/><path d="M315 245H370" class="arrow"/><rect x="390" y="195" width="170" height="100" rx="12" fill="#fff" stroke="#93c5fd" stroke-width="2"/><text x="475" y="235" text-anchor="middle" class="h">Abnormal</text><text x="475" y="265" text-anchor="middle" class="m">Label</text><text x="370" y="365" text-anchor="middle" class="s">입력 → 정답 관계를 학습</text>
<rect x="860" y="110" width="540" height="330" rx="20" class="green"/><text x="1130" y="148" text-anchor="middle" class="h">비지도학습</text><text x="1130" y="175" text-anchor="middle" class="s">Input only · 정답 Label 없음</text>
<circle cx="970" cy="230" r="15" fill="#2563eb"/><circle cx="1015" cy="270" r="15" fill="#2563eb"/><circle cx="1040" cy="215" r="15" fill="#2563eb"/><circle cx="1110" cy="245" r="15" fill="#ef4444"/><circle cx="1160" cy="290" r="15" fill="#ef4444"/><circle cx="1190" cy="225" r="15" fill="#ef4444"/><text x="1130" y="350" text-anchor="middle" class="s">비슷한 데이터의 구조·군집·이상치 탐색</text>
<text x="750" y="515" text-anchor="middle" class="h">지도학습: “정답을 맞히기” · 비지도학습: “데이터가 어떻게 모여 있는지 이해하기”</text></svg>