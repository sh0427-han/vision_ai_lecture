<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" fill="#fff"/><style>.t{font:700 27px Arial;fill:#111827}.l{font:600 19px Arial;fill:#111827}.s{font:400 15px Arial;fill:#475569}.b{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.a{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.line{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="600" y="48" text-anchor="middle" class="t">CNN Feature Extraction</text><g transform="translate(35 120)"><rect width="180" height="95" rx="15" class="b"/><text x="90" y="40" text-anchor="middle" class="l">Input</text><text x="90" y="67" text-anchor="middle" class="s">224×224×3</text></g><line x1="215" y1="168" x2="275" y2="168" class="line"/><g transform="translate(280 120)"><rect width="180" height="95" rx="15" class="a"/><text x="90" y="40" text-anchor="middle" class="l">3×3 Conv</text><text x="90" y="67" text-anchor="middle" class="s">Local pattern</text></g><line x1="460" y1="168" x2="520" y2="168" class="line"/><g transform="translate(525 120)"><rect width="180" height="95" rx="15" class="b"/><text x="90" y="40" text-anchor="middle" class="l">Feature Map</text><text x="90" y="67" text-anchor="middle" class="s">Edge / texture</text></g><line x1="705" y1="168" x2="765" y2="168" class="line"/><g transform="translate(770 120)"><rect width="180" height="95" rx="15" class="a"/><text x="90" y="40" text-anchor="middle" class="l">Deep Layers</text><text x="90" y="67" text-anchor="middle" class="s">Larger receptive field</text></g><line x1="950" y1="168" x2="1010" y2="168" class="line"/><g transform="translate(1015 120)"><rect width="150" height="95" rx="15" class="b"/><text x="75" y="40" text-anchor="middle" class="l">Semantic</text><text x="75" y="67" text-anchor="middle" class="s">Object feature</text></g><text x="600" y="305" text-anchor="middle" class="l">공간 크기는 줄고, 표현의 추상도와 Channel은 커지는 방향으로 설계되는 경우가 많다.</text></svg>