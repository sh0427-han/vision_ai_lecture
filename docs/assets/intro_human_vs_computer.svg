<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="50" text-anchor="middle" class="t">같은 사과도 처음 입력은 완전히 다릅니다</text>
<rect x="80" y="100" width="580" height="470" rx="20" class="box"/><text x="370" y="138" text-anchor="middle" class="h">사람</text><text x="370" y="165" text-anchor="middle" class="s">의미와 특징을 함께 인식</text>
<circle cx="370" cy="305" r="125" fill="#ef4444"/><ellipse cx="320" cy="260" rx="30" ry="18" fill="#fecaca"/><rect x="355" y="155" width="20" height="70" rx="8" fill="#7c2d12"/><ellipse cx="408" cy="180" rx="50" ry="22" fill="#65a30d" transform="rotate(-22 408 180)"/>
<text x="195" y="225" class="s">색</text><path d="M225 230 L270 268" class="arrow"/><text x="168" y="390" class="s">둥근 윤곽</text><path d="M270 380 L285 350" class="arrow"/><text x="470" y="225" class="s">꼭지 · 잎</text><path d="M470 230 L425 205" class="arrow"/><text x="430" y="402" class="s">표면 질감</text><path d="M430 390 L405 355" class="arrow"/>
<text x="370" y="510" text-anchor="middle" class="h">“사과”</text><text x="370" y="540" text-anchor="middle" class="s">여러 단서를 종합해 바로 의미를 이해</text>
<rect x="840" y="100" width="580" height="470" rx="20" class="box"/><text x="1130" y="138" text-anchor="middle" class="h">컴퓨터</text><text x="1130" y="165" text-anchor="middle" class="s">Pixel × RGB Channel 숫자 배열</text>
<g transform="translate(885 195)"><rect width="220" height="230" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><circle cx="110" cy="130" r="74" fill="#ef4444"/><rect x="104" y="46" width="12" height="38" rx="5" fill="#7c2d12"/><ellipse cx="140" cy="62" rx="32" ry="13" fill="#65a30d" transform="rotate(-20 140 62)"/><g stroke="#fff" stroke-width="1.5" opacity=".7"><path d="M0 32H220M0 64H220M0 96H220M0 128H220M0 160H220M0 192H220"/><path d="M32 0V230M64 0V230M96 0V230M128 0V230M160 0V230M192 0V230"/></g></g>
<path d="M1125 310 L1170 310" class="arrow"/>
<g transform="translate(1190 180)"><text x="98" y="0" text-anchor="middle" class="m">RGB channel values</text><rect y="18" width="180" height="220" rx="12" class="soft"/><text x="18" y="55" class="n">[243,233,228]</text><text x="18" y="82" class="n">[239, 68, 68]</text><text x="18" y="109" class="n">[226, 55, 55]</text><text x="18" y="136" class="n">[124, 45, 18]</text><text x="18" y="163" class="n">[101,163, 13]</text><text x="18" y="195" class="n">...</text></g>
<text x="1130" y="510" text-anchor="middle" class="h">숫자 배열</text><text x="1130" y="540" text-anchor="middle" class="s">모델이 학습하기 전에는 “사과”라는 의미가 없음</text>
<text x="750" y="645" text-anchor="middle" class="h">Vision AI: 숫자 배열에서 반복되는 패턴을 학습해 의미를 찾는 과정</text></svg>