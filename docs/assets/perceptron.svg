<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Perceptron: 입력을 중요도와 함께 합쳐 하나의 출력을 만드는 가장 단순한 계산</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">먼저 구조를 이해하고, 수식은 그 구조를 짧게 적는 방법으로 봅니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(70 150)">
   <text x="0" y="-15" font-size="20" font-weight="700" fill="#17243b">입력 Feature</text>
   <rect x="0" y="15" width="170" height="70" rx="14" fill="#eef2ff"/><text x="85" y="45" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">x₁ = 0.8</text><text x="85" y="68" text-anchor="middle" font-size="16" fill="#64748b">예: 밝기</text>
   <rect x="0" y="115" width="170" height="70" rx="14" fill="#eef2ff"/><text x="85" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#4338ca">x₂ = 0.2</text><text x="85" y="168" text-anchor="middle" font-size="16" fill="#64748b">예: 모양</text>
 </g>
 <g transform="translate(330 150)">
   <text x="0" y="-15" font-size="20" font-weight="700" fill="#17243b">중요도 · Weight</text>
   <rect x="0" y="15" width="180" height="70" rx="14" fill="#eff6ff"/><text x="90" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">× w₁</text>
   <rect x="0" y="115" width="180" height="70" rx="14" fill="#eff6ff"/><text x="90" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">× w₂</text>
 </g>
 <g transform="translate(610 180)">
   <rect width="180" height="140" rx="70" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
   <text x="90" y="55" text-anchor="middle" font-size="19" font-weight="700" fill="#17243b">합치기</text>
   <text x="90" y="88" text-anchor="middle" font-size="21" fill="#334155">Σ(wx) + b</text>
   <text x="90" y="115" text-anchor="middle" font-size="16" fill="#64748b">Weighted sum</text>
 </g>
 <g transform="translate(880 180)">
   <rect width="150" height="140" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
   <text x="75" y="53" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">Activation</text>
   <text x="75" y="88" text-anchor="middle" font-size="19" fill="#9a3412">f(z)</text>
   <text x="75" y="114" text-anchor="middle" font-size="16" fill="#64748b">판단 규칙</text>
 </g>
 <g transform="translate(1080 205)">
   <circle cx="40" cy="45" r="40" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
   <text x="40" y="39" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">Output</text>
   <text x="40" y="63" text-anchor="middle" font-size="20" font-weight="700" fill="#15803d">1</text>
 </g>
 <path d="M245 200H320M245 300H320M520 235H600M520 335 C565 335 565 280 600 280M800 250H870M1040 250H1070" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#a)"/>
 <rect x="190" y="430" width="820" height="85" rx="16" fill="#eef6ff"/>
 <text x="600" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#17243b">핵심: Weight는 “이 입력을 얼마나 중요하게 볼지”를 나타냅니다.</text>
 <text x="600" y="494" text-anchor="middle" font-size="18" fill="#53647b">Training은 좋은 Output이 나오도록 w와 b를 자동으로 찾는 과정입니다.</text>
</g>
</svg>