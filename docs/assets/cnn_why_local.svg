<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">CNN은 이미지의 “가까운 Pixel끼리의 관계”를 활용하도록 설계되었습니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">이미지는 위치 관계가 중요하므로, 작은 Local 영역을 보고 같은 계산을 여러 위치에 반복하는 방식이 유용합니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(60 145)">
  <rect width="500" height="390" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="23" font-weight="700" fill="#be123c">Flatten해서 모두 연결하면</text>
  <g transform="translate(40 82)">
   <rect width="190" height="190" rx="12" fill="#fff" stroke="#d8e1ed"/>
   <g fill="#e2e8f0" stroke="#cbd5e1">
    <rect x="15" y="15" width="28" height="28"/><rect x="47" y="15" width="28" height="28"/><rect x="79" y="15" width="28" height="28"/><rect x="111" y="15" width="28" height="28"/><rect x="143" y="15" width="28" height="28"/>
    <rect x="15" y="47" width="28" height="28"/><rect x="47" y="47" width="28" height="28" fill="#fecaca"/><rect x="79" y="47" width="28" height="28" fill="#fecaca"/><rect x="111" y="47" width="28" height="28"/><rect x="143" y="47" width="28" height="28"/>
    <rect x="15" y="79" width="28" height="28"/><rect x="47" y="79" width="28" height="28" fill="#fecaca"/><rect x="79" y="79" width="28" height="28" fill="#ef4444"/><rect x="111" y="79" width="28" height="28" fill="#fecaca"/><rect x="143" y="79" width="28" height="28"/>
    <rect x="15" y="111" width="28" height="28"/><rect x="47" y="111" width="28" height="28"/><rect x="79" y="111" width="28" height="28" fill="#fecaca"/><rect x="111" y="111" width="28" height="28"/><rect x="143" y="111" width="28" height="28"/>
    <rect x="15" y="143" width="28" height="28"/><rect x="47" y="143" width="28" height="28"/><rect x="79" y="143" width="28" height="28"/><rect x="111" y="143" width="28" height="28"/><rect x="143" y="143" width="28" height="28"/>
   </g>
  </g>
  <path d="M255 105L385 95M255 130L385 125M255 155L385 155M255 180L385 185M255 205L385 215M255 230L385 245" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="410" cy="95" r="14" fill="#fff1f2" stroke="#fb7185"/><circle cx="410" cy="155" r="14" fill="#fff1f2" stroke="#fb7185"/><circle cx="410" cy="215" r="14" fill="#fff1f2" stroke="#fb7185"/>
  <text x="250" y="315" text-anchor="middle" font-size="18" fill="#475569">위치 구조가 숫자 나열로 사라짐</text>
  <text x="250" y="348" text-anchor="middle" font-size="18" fill="#475569">연결 Weight 수도 빠르게 증가</text>
 </g>
 <g transform="translate(640 145)">
  <rect width="500" height="390" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="23" font-weight="700" fill="#15803d">CNN은 Local 영역을 반복해서 봅니다</text>
  <g transform="translate(40 82)">
   <rect width="190" height="190" rx="12" fill="#fff" stroke="#d8e1ed"/>
   <g fill="#e2e8f0" stroke="#cbd5e1">
    <rect x="15" y="15" width="28" height="28"/><rect x="47" y="15" width="28" height="28"/><rect x="79" y="15" width="28" height="28"/><rect x="111" y="15" width="28" height="28"/><rect x="143" y="15" width="28" height="28"/>
    <rect x="15" y="47" width="28" height="28"/><rect x="47" y="47" width="28" height="28" fill="#dbeafe"/><rect x="79" y="47" width="28" height="28" fill="#dbeafe"/><rect x="111" y="47" width="28" height="28" fill="#dbeafe"/><rect x="143" y="47" width="28" height="28"/>
    <rect x="15" y="79" width="28" height="28"/><rect x="47" y="79" width="28" height="28" fill="#dbeafe"/><rect x="79" y="79" width="28" height="28" fill="#2563eb"/><rect x="111" y="79" width="28" height="28" fill="#dbeafe"/><rect x="143" y="79" width="28" height="28"/>
    <rect x="15" y="111" width="28" height="28"/><rect x="47" y="111" width="28" height="28" fill="#dbeafe"/><rect x="79" y="111" width="28" height="28" fill="#dbeafe"/><rect x="111" y="111" width="28" height="28" fill="#dbeafe"/><rect x="143" y="111" width="28" height="28"/>
    <rect x="15" y="143" width="28" height="28"/><rect x="47" y="143" width="28" height="28"/><rect x="79" y="143" width="28" height="28"/><rect x="111" y="143" width="28" height="28"/><rect x="143" y="143" width="28" height="28"/>
   </g>
   <rect x="45" y="45" width="98" height="98" fill="none" stroke="#2563eb" stroke-width="5"/>
  </g>
  <rect x="285" y="120" width="145" height="95" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="357" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">3 × 3 Kernel</text>
  <text x="357" y="185" text-anchor="middle" font-size="18" fill="#475569">같은 Weight 재사용</text>
  <path d="M240 175H275" stroke="#64748b" stroke-width="4"/>
  <text x="250" y="315" text-anchor="middle" font-size="18" fill="#475569">가까운 Pixel의 관계 유지</text>
  <text x="250" y="348" text-anchor="middle" font-size="18" fill="#475569">같은 Pattern을 위치가 달라도 탐색</text>
 </g>
</g>
</svg>