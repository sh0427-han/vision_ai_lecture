<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">Train 성능만 높아도 새로운 데이터에서 잘 동작하는 것은 아닙니다</text>
<rect x="70" y="110" width="620" height="390" rx="20" class="soft"/><text x="380" y="148" text-anchor="middle" class="h">Generalization vs Overfitting</text><text x="380" y="175" text-anchor="middle" class="s">Train / Validation loss</text>
<path d="M135 430H625M135 180V430" stroke="#94a3b8" stroke-width="3"/><path d="M150 230 C250 280,350 340,600 400" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M150 240 C270 300,360 360,430 350 C500 340,535 255,600 185" fill="none" stroke="#ef4444" stroke-width="5"/><text x="565" y="395" class="m">Train</text><text x="550" y="195" class="m" fill="#ef4444">Validation</text><text x="465" y="330" class="h">Overfitting</text>
<rect x="810" y="110" width="620" height="390" rx="20" class="red"/><text x="1120" y="148" text-anchor="middle" class="h">Data Leakage</text><text x="1120" y="175" text-anchor="middle" class="s">같은 원본 영상 Frame이 양쪽에 들어간 경우</text>
<rect x="870" y="200" width="180" height="130" rx="12" fill="#dbeafe"/><rect x="880" y="210" width="160" height="110" rx="10" fill="#94a3b8"/><circle cx="995" cy="245" r="12" fill="#ef4444"/><text x="960" y="365" text-anchor="middle" class="h">Train</text>
<rect x="1170" y="200" width="180" height="130" rx="12" fill="#dcfce7"/><rect x="1180" y="210" width="160" height="110" rx="10" fill="#94a3b8"/><circle cx="1295" cy="245" r="12" fill="#ef4444"/><text x="1260" y="365" text-anchor="middle" class="h">Test</text><path d="M1055 265H1160" class="arrow"/><text x="1110" y="440" text-anchor="middle" class="s">거의 같은 Frame이면 실제 성능보다 높게 보일 수 있음</text></svg>