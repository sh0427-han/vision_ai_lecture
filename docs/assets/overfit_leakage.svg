<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Overfitting과 Generalization을 Train Validation 성능 변화로 설명">
<rect width="1200" height="600" rx="28" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#17243b">잘 외우는 모델보다, 새로운 데이터에서도 잘 맞는 모델이 목표입니다</text>
<text x="60" y="100" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">Train 성능만 계속 좋아지고 Validation 성능이 나빠지기 시작하면 Overfitting을 의심할 수 있습니다.</text>

<g transform="translate(80 145)" font-family="Arial, Noto Sans KR, sans-serif">
  <rect width="700" height="380" rx="22" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
  <line x1="80" y1="310" x2="630" y2="310" stroke="#94a3b8" stroke-width="3"/>
  <line x1="80" y1="310" x2="80" y2="65" stroke="#94a3b8" stroke-width="3"/>
  <text x="600" y="345" font-size="18" fill="#64748b">Epoch</text>
  <text x="25" y="90" font-size="18" fill="#64748b">Loss</text>
  <path d="M95 95 C180 150 280 205 390 248 C480 280 550 292 615 296" fill="none" stroke="#2563eb" stroke-width="7"/>
  <path d="M95 112 C190 175 270 225 350 248 C405 262 450 252 495 230 C545 205 580 180 615 150" fill="none" stroke="#e11d48" stroke-width="7"/>
  <line x1="405" y1="75" x2="405" y2="310" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="405" cy="257" r="11" fill="#16a34a"/>
  <text x="420" y="92" font-size="18" font-weight="700" fill="#15803d">좋은 선택 지점</text>
  <text x="470" y="287" font-size="18" font-weight="700" fill="#2563eb">Train</text>
  <text x="540" y="140" font-size="18" font-weight="700" fill="#be123c">Validation</text>
  <text x="455" y="335" font-size="18" font-weight="700" fill="#be123c">Overfitting 구간 →</text>
</g>

<g transform="translate(830 165)" font-family="Arial, Noto Sans KR, sans-serif">
  <rect width="300" height="145" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="24" y="42" font-size="21" font-weight="700" fill="#1d4ed8">Generalization</text>
  <text x="24" y="78" font-size="18" fill="#334155">보지 못한 데이터에서도</text>
  <text x="24" y="108" font-size="18" fill="#334155">성능이 유지되는 능력</text>

  <rect y="175" width="300" height="145" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
  <text x="24" y="217" font-size="21" font-weight="700" fill="#be123c">Overfitting</text>
  <text x="24" y="253" font-size="18" fill="#334155">Train에 지나치게 맞아</text>
  <text x="24" y="283" font-size="18" fill="#334155">새 데이터 성능이 떨어짐</text>
</g>
</svg>