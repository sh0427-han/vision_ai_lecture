<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">클래스 불균형의 학습 대응과 평가</title><desc id="figure-desc">클래스 불균형의 학습 대응과 평가</desc><defs><marker id="a-275879" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#275879"/></marker><marker id="a-36756f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#36756f"/></marker><marker id="a-b2773d" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#b2773d"/></marker></defs><rect width="1200" height="480" fill="white"/><text x="35" y="42" font-size="27" fill="#275879" text-anchor="start" font-weight="700">학습 데이터 예시: 정상 95장 · 불량 5장</text><rect x="35" y="70" width="1073.5" height="58" rx="4" fill="#e8eff4" stroke="#e8eff4" stroke-width="1.8"/><rect x="1108.5" y="70" width="56.5" height="58" rx="4" fill="#ead9c7" stroke="#ead9c7" stroke-width="1.8"/><text x="60" y="108" font-size="25" fill="#275879" text-anchor="start" font-weight="700">정상 95%</text><text x="1165" y="163" font-size="23" fill="#b2773d" text-anchor="end" font-weight="700">불량 5%</text><rect x="35" y="200" width="330" height="190" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="60" y="247" font-size="28" fill="#275879" text-anchor="start" font-weight="700">표본을 조정</text><text x="60" y="300" font-size="23" fill="#17243b" text-anchor="start" font-weight="400">Train에서만 Sampling</text><text x="60" y="348" font-size="23" fill="#17243b" text-anchor="start" font-weight="400">소수 클래스 노출 증가</text><rect x="435" y="200" width="330" height="190" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="460" y="247" font-size="28" fill="#275879" text-anchor="start" font-weight="700">Loss 기여를 조정</text><text x="460" y="300" font-size="23" fill="#17243b" text-anchor="start" font-weight="400">클래스별 가중치 적용</text><text x="460" y="348" font-size="23" fill="#17243b" text-anchor="start" font-weight="400">빈도만으로 확정하지 않음</text><rect x="835" y="200" width="330" height="190" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="860" y="247" font-size="28" fill="#275879" text-anchor="start" font-weight="700">클래스별로 평가</text><text x="860" y="300" font-size="23" fill="#17243b" text-anchor="start" font-weight="400">불량 Recall · Precision</text><text x="860" y="348" font-size="23" fill="#17243b" text-anchor="start" font-weight="400">오알람 수와 함께 확인</text><text x="600" y="443" font-size="25" fill="#36756f" text-anchor="middle" font-weight="400">Test는 실제 운영의 분포를 유지하고, 설정은 Validation에서 선택</text></svg>
