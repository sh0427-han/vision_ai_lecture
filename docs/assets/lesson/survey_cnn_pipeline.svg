<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">작은 CNN 분류기의 연산과 HWC 크기</title><desc id="figure-desc">작은 CNN 분류기의 연산과 HWC 크기</desc><defs><marker id="a-275879" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#275879"/></marker><marker id="a-36756f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#36756f"/></marker><marker id="a-b2773d" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#b2773d"/></marker></defs><rect width="1200" height="480" fill="white"/><rect x="35" y="85" width="190" height="230" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="130" y="132" font-size="23" fill="#275879" text-anchor="middle" font-weight="700">입력</text><text x="130" y="204" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">RGB 이미지</text><text x="130" y="254" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">224×224×3</text><path d="M235 205 L255 205" fill="none" stroke="#275879" stroke-width="2.5" marker-end="url(#a-275879)"/><rect x="270" y="85" width="190" height="230" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="365" y="132" font-size="23" fill="#275879" text-anchor="middle" font-weight="700">Conv + ReLU</text><text x="365" y="204" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">3×3 필터 16개</text><text x="365" y="254" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">224×224×16</text><path d="M470 205 L490 205" fill="none" stroke="#275879" stroke-width="2.5" marker-end="url(#a-275879)"/><rect x="505" y="85" width="190" height="230" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="600" y="132" font-size="23" fill="#275879" text-anchor="middle" font-weight="700">Max Pooling</text><text x="600" y="204" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">2×2 · Stride 2</text><text x="600" y="254" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">112×112×16</text><path d="M705 205 L725 205" fill="none" stroke="#275879" stroke-width="2.5" marker-end="url(#a-275879)"/><rect x="740" y="85" width="190" height="230" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="835" y="132" font-size="23" fill="#275879" text-anchor="middle" font-weight="700">Global Average</text><text x="835" y="204" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">Channel별 평균</text><text x="835" y="254" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">길이 16 벡터</text><path d="M940 205 L960 205" fill="none" stroke="#275879" stroke-width="2.5" marker-end="url(#a-275879)"/><rect x="975" y="85" width="190" height="230" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="1070" y="132" font-size="23" fill="#275879" text-anchor="middle" font-weight="700">Linear</text><text x="1070" y="204" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">16 → 2</text><text x="1070" y="254" font-size="22" fill="#17243b" text-anchor="middle" font-weight="400">클래스별 Logit</text><text x="35" y="370" font-size="25" fill="#64748b" text-anchor="start" font-weight="400">Conv: Stride 1 · Padding 1 · Dilation 1 · Groups 1</text><text x="35" y="417" font-size="25" fill="#36756f" text-anchor="start" font-weight="400">Global Average Pooling은 위치 전체를 평균 → 각 Channel에서 숫자 1개</text><text x="35" y="462" font-size="23" fill="#64748b" text-anchor="start" font-weight="400">분류 결과를 표시할 때는 Logit에 Softmax를 적용할 수 있습니다</text></svg>
