<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" font-family="Noto Sans CJK KR, Malgun Gothic, sans-serif" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Residual 합산의 텐서 크기와 수치 예시</title><desc id="figure-desc">Residual 합산의 텐서 크기와 수치 예시</desc><defs><marker id="a-275879" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#275879"/></marker><marker id="a-36756f" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#36756f"/></marker><marker id="a-b2773d" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#b2773d"/></marker></defs><rect width="1200" height="480" fill="white"/><text x="35" y="35" font-size="27" fill="#275879" text-anchor="start" font-weight="700">같은 Shape의 두 경로를 원소별로 더합니다</text><rect x="35" y="150" width="165" height="100" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1.8"/><text x="117.5" y="193" font-size="27" fill="#17243b" text-anchor="middle" font-weight="700">입력 x</text><text x="117.5" y="232" font-size="23" fill="#64748b" text-anchor="middle" font-weight="400">56×56×64</text><rect x="335" y="150" width="360" height="100" rx="4" fill="#f2f6fa" stroke="#cbd5e1" stroke-width="1.8"/><text x="515" y="193" font-size="29" fill="#275879" text-anchor="middle" font-weight="700">변환 블록 F(x)</text><text x="515" y="232" font-size="25" fill="#64748b" text-anchor="middle" font-weight="400">56×56×64</text><path d="M200 200 L320 200" fill="none" stroke="#275879" stroke-width="2.5" marker-end="url(#a-275879)"/><path d="M710 200 L830 200" fill="none" stroke="#275879" stroke-width="2.5" marker-end="url(#a-275879)"/><path d="M235 200 V105 H865 V165" fill="none" stroke="#36756f" stroke-width="2.5" marker-end="url(#a-36756f)"/><text x="550" y="90" font-size="25" fill="#36756f" text-anchor="middle" font-weight="400">Identity 경로: x를 그대로 전달</text><circle cx="865" cy="200" r="34" fill="white" stroke="#36756f" stroke-width="2"/><text x="865" y="211" font-size="32" fill="#36756f" text-anchor="middle" font-weight="700">+</text><path d="M912 200 L1010 200" fill="none" stroke="#275879" stroke-width="2.5" marker-end="url(#a-275879)"/><text x="1035" y="190" font-size="26" fill="#17243b" text-anchor="start" font-weight="700">합산 결과</text><text x="1035" y="231" font-size="23" fill="#64748b" text-anchor="start" font-weight="400">56×56×64</text><rect x="35" y="315" width="1130" height="125" rx="4" fill="#edf5f2" stroke="#cbd5e1" stroke-width="1.8"/><text x="65" y="360" font-size="27" fill="#17243b" text-anchor="start" font-weight="400">한 위치의 숫자 예시: x = 2,  F(x) = −0.5</text><text x="65" y="407" font-size="26" fill="#36756f" text-anchor="start" font-weight="400">F(x) + x = 1.5     ·     Shape가 다르면 Projection 등으로 맞춤</text></svg>
