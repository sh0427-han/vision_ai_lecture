-weight="400">∂L/∂w = −4 × 2 = −8</text><text x="600.0" y="309" font-size="27" fill="#17243b" text-anchor="middle" font-weight="400">∂L/∂b = −4</text><rect x="830" y="35" width="330" height="430" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="995.0" y="83" font-size="30" fill="#36756f" text-anchor="middle" font-weight="700">SGD, η = 0.1</text><text x="995.0" y="153" font-size="27" fill="#17243b" text-anchor="middle" font-weight="400">w′ = 1 − 0.1 × (−8)</text><text x="995.0" y="205" font-size="27" fill="#17243b" text-anchor="middle" font-weight="400">= 1.8</text><text x="995.0" y="257" font-size="27" fill="#17243b" text-anchor="middle" font-weight="400">b′ = 0.4</text><text x="995.0" y="309" font-size="27" fill="#17243b" text-anchor="middle" font-weight="400">ŷ′ = 1.8 × 2 + 0.4 = 4</text><path d="M375 245 L425 245" stroke="#275879" stroke-width="2.5" fill="none" marker-end="url(#arrow-275879)"/><path d="M770 245 L820 245" stroke="#275879" stroke-width="2.5" fill="none" marker-end="url(#arrow-275879)"/></svg>
