<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 105 1200 495" role="img" aria-label="Shortcut learning example where background color is spuriously correlated with class">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="600" fill="#fff"/>
<g font-family="Arial,sans-serif">
  <g transform="translate(45 145)">
    <rect width="355" height="390" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="25" y="42" font-size="23" font-weight="700" fill="#17243b">① Training Data</text>
    <text x="25" y="72" font-size="18" fill="#64748b">Class와 Background가 함께 반복됨</text>

    <g transform="translate(30 100)">
      <rect width="135" height="110" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="67" cy="56" r="31" fill="#ef4444"/>
      <path d="M67 25C72 8 86 7 95 12" fill="none" stroke="#78350f" stroke-width="6"/>
      <ellipse cx="92" cy="18" rx="13" ry="7" fill="#16a34a" transform="rotate(-25 92 18)"/>
      <text x="67" y="99" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Apple</text>

      <rect x="155" width="135" height="110" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
      <circle cx="222" cy="54" r="31" fill="#f59e0b"/>
      <circle cx="211" cy="44" r="5" fill="#fcd34d"/><circle cx="235" cy="65" r="5" fill="#fcd34d"/>
      <text x="222" y="99" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Orange</text>

      <rect y="135" width="135" height="110" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="67" cy="191" r="31" fill="#ef4444"/>
      <path d="M67 160C72 143 86 142 95 147" fill="none" stroke="#78350f" stroke-width="6"/>
      <ellipse cx="92" cy="153" rx="13" ry="7" fill="#16a34a" transform="rotate(-25 92 153)"/>
      <text x="67" y="234" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Apple</text>

      <rect x="155" y="135" width="135" height="110" rx="14" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
      <circle cx="222" cy="189" r="31" fill="#f59e0b"/>
      <circle cx="211" cy="179" r="5" fill="#fcd34d"/><circle cx="235" cy="200" r="5" fill="#fcd34d"/>
      <text x="222" y="234" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Orange</text>
    </g>
    <text x="178" y="370" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">Apple은 항상 파란 배경 · Orange는 항상 주황 배경</text>
  </g>

  <path d="M415 340H455" stroke="#64748b" stroke-width="5" marker-end="url(#arr)" fill="none"/>

  <g transform="translate(470 145)">
    <rect width="260" height="390" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="25" y="42" font-size="23" font-weight="700" fill="#9a3412">② Easy Shortcut</text>
    <text x="25" y="77" font-size="18" fill="#64748b">“모양” 대신</text>
    <text x="25" y="104" font-size="18" fill="#64748b">“배경색”만 봐도 맞음</text>
    <g transform="translate(45 145)">
      <rect width="170" height="90" rx="14" fill="#eff6ff"/>
      <text x="85" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">Blue background</text>
      <text x="85" y="64" text-anchor="middle" font-size="19" fill="#475569">→ Apple</text>
      <rect y="115" width="170" height="90" rx="14" fill="#fff1f2"/>
      <text x="85" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#ea580c">Orange background</text>
      <text x="85" y="179" text-anchor="middle" font-size="19" fill="#475569">→ Orange</text>
    </g>
    <text x="130" y="365" text-anchor="middle" font-size="18" font-weight="700" fill="#be123c">Training 성능은 높을 수 있음</text>
  </g>

  <path d="M745 340H785" stroke="#64748b" stroke-width="5" marker-end="url(#arr)" fill="none"/>

  <g transform="translate(800 145)">
    <rect width="355" height="390" rx="20" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
    <text x="25" y="42" font-size="23" font-weight="700" fill="#be123c">③ New Condition</text>
    <text x="25" y="72" font-size="18" fill="#64748b">배경과 Object 관계가 바뀌면?</text>
    <g transform="translate(70 105)">
      <rect width="215" height="180" rx="18" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
      <circle cx="107" cy="82" r="48" fill="#ef4444"/>
      <path d="M107 35C114 12 134 12 147 19" fill="none" stroke="#78350f" stroke-width="8"/>
      <ellipse cx="143" cy="27" rx="18" ry="9" fill="#16a34a" transform="rotate(-25 143 27)"/>
      <text x="107" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#17243b">실제: Apple</text>
    </g>
    <rect x="72" y="310" width="210" height="48" rx="12" fill="#ffe4e6"/>
    <text x="177" y="341" text-anchor="middle" font-size="20" font-weight="700" fill="#be123c">Model: “Orange” ✕</text>
    <text x="177" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">운영 조건에서 갑자기 실패</text>
  </g>
</g>
</svg>