 <g transform="translate(425 185)"><rect width="165" height="150" rx="18" fill="#eff6ff" stroke="#bfdbfe"/><text x="83" y="38" font-size="19" font-weight="700" fill="#1d4ed8">③ Train</text><text x="83" y="80" font-size="18" fill="#475569">Weight 학습</text><text x="83" y="108" font-size="18" fill="#475569">Fine-tuning</text></g>
