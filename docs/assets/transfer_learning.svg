<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Transfer Learning은 다른 Dataset에서 배운 Feature를 출발점으로 재사용합니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Fine-tuning은 Pretrained Weight를 내 데이터와 Task에 맞게 추가로 학습하는 과정입니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(55 155)">
  <rect width="250" height="300" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="125" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#17243b">Large Dataset</text>
  <g transform="translate(45 80)">
   <rect width="65" height="65" rx="10" fill="#dbeafe"/><rect x="80" width="65" height="65" rx="10" fill="#ffedd5"/><rect y="80" width="65" height="65" rx="10" fill="#dcfce7"/><rect x="80" y="80" width="65" height="65" rx="10" fill="#ede9fe"/>
  </g>
  <text x="125" y="250" text-anchor="middle" font-size="18" fill="#475569">다양한 Image + Label</text>
 </g>
 <path d="M320 305H375" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
 <g transform="translate(395 155)">
  <rect width="250" height="300" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="125" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Pretrained Backbone</text>
  <g transform="translate(45 90)"><rect width="45" height="130" rx="8" fill="#dbeafe"/><rect x="55" y="20" width="45" height="110" rx="8" fill="#bfdbfe"/><rect x="110" y="40" width="45" height="90" rx="8" fill="#93c5fd"/></g>
  <text x="125" y="250" text-anchor="middle" font-size="18" fill="#475569">이미 학습된 Weight</text>
 </g>
 <path d="M660 305H715" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
 <g transform="translate(735 155)">
  <rect width="410" height="300" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="205" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#15803d">My Dataset + Fine-tuning</text>
  <rect x="35" y="85" width="125" height="90" rx="12" fill="#fff"/><text x="98" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#17243b">내 Image</text><text x="98" y="148" text-anchor="middle" font-size="17" fill="#475569">Class / Box / Mask</text>
  <path d="M175 130H235" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  <rect x="250" y="75" width="125" height="110" rx="12" fill="#dcfce7"/><text x="313" y="113" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">Update</text><text x="313" y="140" text-anchor="middle" font-size="17" fill="#475569">Backbone 일부</text><text x="313" y="164" text-anchor="middle" font-size="17" fill="#475569">+ Head</text>
  <rect x="78" y="220" width="255" height="50" rx="12" fill="#fff"/><text x="205" y="251" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">내 Task에 맞는 Model</text>
 </g>
 <rect x="235" y="500" width="730" height="55" rx="12" fill="#fff7ed"/><text x="600" y="533" text-anchor="middle" font-size="18" fill="#9a3412">주의: Pretraining 데이터와 현장 데이터가 많이 다르면 Transfer 효과도 반드시 검증해야 합니다.</text>
</g>
</svg>