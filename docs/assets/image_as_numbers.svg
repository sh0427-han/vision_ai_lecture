<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540">
  <rect width="1400" height="540" fill="#ffffff"/>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#111827}
    .label{font:700 20px Arial,sans-serif;fill:#111827}
    .small{font:400 15px Arial,sans-serif;fill:#64748b}
    .mono{font:600 17px Consolas,monospace;fill:#334155}
    .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <text x="700" y="46" text-anchor="middle" class="title">사람은 장면을 보고, 컴퓨터는 숫자 배열을 받는다</text>

  <g transform="translate(80 105)">
    <rect width="380" height="300" rx="22" fill="#f8fafc" stroke="#dbe2ea" stroke-width="2"/>
    <rect x="34" y="34" width="312" height="190" rx="16" fill="#dbeafe"/>
    <rect x="34" y="166" width="312" height="58" rx="0" fill="#d1fae5"/>
    <circle cx="180" cy="120" r="46" fill="#fbbf24"/>
    <rect x="215" y="95" width="70" height="62" rx="12" fill="#475569"/>
    <circle cx="232" cy="145" r="15" fill="#0f172a"/><circle cx="271" cy="145" r="15" fill="#0f172a"/>
    <text x="190" y="264" text-anchor="middle" class="label">사람: “자동차가 있네”</text>
  </g>

  <path d="M480 255 L575 255" class="arrow"/>

  <g transform="translate(610 105)">
    <text x="110" y="10" text-anchor="middle" class="label">작은 Pixel Grid</text>
    <g transform="translate(0 34)" stroke="#ffffff" stroke-width="2">
      <rect x="0" y="0" width="46" height="46" fill="#dbeafe"/><rect x="46" y="0" width="46" height="46" fill="#dbeafe"/><rect x="92" y="0" width="46" height="46" fill="#bfdbfe"/><rect x="138" y="0" width="46" height="46" fill="#cbd5e1"/><rect x="184" y="0" width="46" height="46" fill="#cbd5e1"/>
      <rect x="0" y="46" width="46" height="46" fill="#dbeafe"/><rect x="46" y="46" width="46" height="46" fill="#fbbf24"/><rect x="92" y="46" width="46" height="46" fill="#f59e0b"/><rect x="138" y="46" width="46" height="46" fill="#64748b"/><rect x="184" y="46" width="46" height="46" fill="#475569"/>
      <rect x="0" y="92" width="46" height="46" fill="#d1fae5"/><rect x="46" y="92" width="46" height="46" fill="#fbbf24"/><rect x="92" y="92" width="46" height="46" fill="#f59e0b"/><rect x="138" y="92" width="46" height="46" fill="#334155"/><rect x="184" y="92" width="46" height="46" fill="#0f172a"/>
      <rect x="0" y="138" width="46" height="46" fill="#d1fae5"/><rect x="46" y="138" width="46" height="46" fill="#a7f3d0"/><rect x="92" y="138" width="46" height="46" fill="#a7f3d0"/><rect x="138" y="138" width="46" height="46" fill="#64748b"/><rect x="184" y="138" width="46" height="46" fill="#334155"/>
    </g>
    <text x="115" y="260" text-anchor="middle" class="small">각 칸에는 R, G, B 숫자가 저장된다</text>
  </g>

  <path d="M860 255 L940 255" class="arrow"/>

  <g transform="translate(980 118)">
    <text x="160" y="0" text-anchor="middle" class="label">컴퓨터가 받는 값</text>
    <text x="0" y="52" class="mono">[ [ [219,234,254], ... ],</text>
    <text x="0" y="87" class="mono">  [ [251,191, 36], ... ],</text>
    <text x="0" y="122" class="mono">  [ [ 71, 85,105], ... ],</text>
    <text x="0" y="157" class="mono">  ... ]</text>
    <text x="0" y="212" class="small">1920×1080 RGB 한 장</text>
    <text x="0" y="240" class="label">6,220,800 channel values</text>
    <text x="0" y="274" class="small">30 FPS라면 초당 약 1억 8,662만 개의 값</text>
  </g>
</svg>