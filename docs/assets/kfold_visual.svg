<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">K-Fold는 Validation 대상을 바꿔가며 같은 실험을 여러 번 반복합니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">예: 3-Fold Cross Validation · 각 Fold가 한 번씩 Validation 역할을 맡음</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(90 150)">
  <text x="0" y="33" font-size="20" font-weight="700" fill="#17243b">Fold 1</text>
  <rect x="120" y="0" width="270" height="65" rx="10" fill="#dcfce7"/><rect x="400" y="0" width="270" height="65" rx="10" fill="#dbeafe"/><rect x="680" y="0" width="270" height="65" rx="10" fill="#dbeafe"/>
  <text x="255" y="40" text-anchor="middle" font-size="18" fill="#15803d">Validation</text><text x="535" y="40" text-anchor="middle" font-size="18" fill="#1d4ed8">Train</text><text x="815" y="40" text-anchor="middle" font-size="18" fill="#1d4ed8">Train</text>
 </g>
 <g transform="translate(90 245)">
  <text x="0" y="33" font-size="20" font-weight="700" fill="#17243b">Fold 2</text>
  <rect x="120" y="0" width="270" height="65" rx="10" fill="#dbeafe"/><rect x="400" y="0" width="270" height="65" rx="10" fill="#dcfce7"/><rect x="680" y="0" width="270" height="65" rx="10" fill="#dbeafe"/>
  <text x="255" y="40" text-anchor="middle" font-size="18" fill="#1d4ed8">Train</text><text x="535" y="40" text-anchor="middle" font-size="18" fill="#15803d">Validation</text><text x="815" y="40" text-anchor="middle" font-size="18" fill="#1d4ed8">Train</text>
 </g>
 <g transform="translate(90 340)">
  <text x="0" y="33" font-size="20" font-weight="700" fill="#17243b">Fold 3</text>
  <rect x="120" y="0" width="270" height="65" rx="10" fill="#dbeafe"/><rect x="400" y="0" width="270" height="65" rx="10" fill="#dbeafe"/><rect x="680" y="0" width="270" height="65" rx="10" fill="#dcfce7"/>
  <text x="255" y="40" text-anchor="middle" font-size="18" fill="#1d4ed8">Train</text><text x="535" y="40" text-anchor="middle" font-size="18" fill="#1d4ed8">Train</text><text x="815" y="40" text-anchor="middle" font-size="18" fill="#15803d">Validation</text>
 </g>
 <rect x="250" y="470" width="700" height="70" rx="14" fill="#f8fafc" stroke="#d8e1ed"/>
 <text x="600" y="500" text-anchor="middle" font-size="19" font-weight="700" fill="#17243b">세 번의 Validation Metric 평균 + Fold 간 변동을 함께 확인</text>
 <text x="600" y="528" text-anchor="middle" font-size="17" fill="#64748b">같은 원본이 섞일 위험이 있으면 Group K-Fold를 사용</text>
</g>
</svg>