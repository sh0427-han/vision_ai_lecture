<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">CNN은 작은 패턴부터 더 복잡한 의미로 특징을 조합합니다</text>
<rect x="55" y="150" width="190" height="210" rx="20" class="soft"/><text x="150" y="188" text-anchor="middle" class="h">Pixel</text><text x="150" y="215" text-anchor="middle" class="s">색·밝기</text><rect x="320" y="150" width="190" height="210" rx="20" class="blue"/><text x="415" y="188" text-anchor="middle" class="h">Edge</text><text x="415" y="215" text-anchor="middle" class="s">방향·경계</text><rect x="585" y="150" width="190" height="210" rx="20" class="blue"/><text x="680" y="188" text-anchor="middle" class="h">Texture</text><text x="680" y="215" text-anchor="middle" class="s">반복 패턴</text><rect x="850" y="150" width="190" height="210" rx="20" class="green"/><text x="945" y="188" text-anchor="middle" class="h">Shape</text><text x="945" y="215" text-anchor="middle" class="s">형상</text><rect x="1115" y="150" width="320" height="210" rx="20" class="green"/><text x="1275" y="188" text-anchor="middle" class="h">Object Feature</text><text x="1275" y="215" text-anchor="middle" class="s">부분 구조·의미</text>
<path d="M250 255H310" class="arrow"/><path d="M515 255H575" class="arrow"/><path d="M780 255H840" class="arrow"/><path d="M1045 255H1105" class="arrow"/><text x="750" y="445" text-anchor="middle" class="h">깊은 Layer일수록 더 넓은 영역을 보고, 더 복잡한 패턴을 표현합니다</text></svg>