<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="AND와 XOR의 선형 분리 가능성 비교">
<rect width="1200" height="600" rx="28" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#17243b">AND는 직선 하나로 나뉘고, XOR는 비선형 경계가 필요합니다</text>
<text x="60" y="100" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">파란 점 = Output 1, 흰 점 = Output 0</text>

<g transform="translate(85 150)" font-family="Arial, Noto Sans KR, sans-serif">
  <rect width="455" height="360" rx="22" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
  <text x="28" y="42" font-size="24" font-weight="700" fill="#17243b">AND</text>
  <text x="28" y="72" font-size="18" fill="#15803d">직선 하나로 분리 가능</text>
  <line x1="100" y1="290" x2="365" y2="290" stroke="#94a3b8" stroke-width="3"/>
  <line x1="100" y1="290" x2="100" y2="95" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="145" cy="248" r="17" fill="#fff" stroke="#334155" stroke-width="4"/>
  <circle cx="145" cy="140" r="17" fill="#fff" stroke="#334155" stroke-width="4"/>
  <circle cx="300" cy="248" r="17" fill="#fff" stroke="#334155" stroke-width="4"/>
  <circle cx="300" cy="140" r="17" fill="#2563eb"/>
  <line x1="205" y1="285" x2="355" y2="115" stroke="#16a34a" stroke-width="6"/>
  <text x="135" y="325" font-size="18" fill="#64748b">x₁</text>
  <text x="68" y="115" font-size="18" fill="#64748b">x₂</text>
  <text x="235" y="340" font-size="18" font-weight="700" fill="#15803d">Linear separable</text>
</g>

<g transform="translate(660 150)" font-family="Arial, Noto Sans KR, sans-serif">
  <rect width="455" height="360" rx="22" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
  <text x="28" y="42" font-size="24" font-weight="700" fill="#17243b">XOR</text>
  <text x="28" y="72" font-size="18" fill="#be123c">직선 하나로는 분리 불가</text>
  <line x1="100" y1="290" x2="365" y2="290" stroke="#94a3b8" stroke-width="3"/>
  <line x1="100" y1="290" x2="100" y2="95" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="145" cy="248" r="17" fill="#fff" stroke="#334155" stroke-width="4"/>
  <circle cx="145" cy="140" r="17" fill="#2563eb"/>
  <circle cx="300" cy="248" r="17" fill="#2563eb"/>
  <circle cx="300" cy="140" r="17" fill="#fff" stroke="#334155" stroke-width="4"/>
  <path d="M120 190 C160 95 280 95 325 190 C280 285 165 285 120 190Z" fill="none" stroke="#e11d48" stroke-width="6" stroke-dasharray="12 9"/>
  <text x="135" y="325" font-size="18" fill="#64748b">x₁</text>
  <text x="68" y="115" font-size="18" fill="#64748b">x₂</text>
  <text x="205" y="340" font-size="18" font-weight="700" fill="#be123c">Non-linear boundary</text>
</g>
</svg>