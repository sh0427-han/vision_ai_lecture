<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Perceptron 하나는 직선 경계를 만들 수 있지만 XOR는 더 복잡합니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">표의 네 가지 경우를 좌표에 옮겨 보면 차이가 바로 보입니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(55 135)">
  <rect width="520" height="390" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="24" font-weight="700" fill="#15803d">AND</text>
  <g transform="translate(25 70)" font-size="18">
   <text x="0" y="0" font-weight="700" fill="#475569">x₁ x₂ → y</text>
   <text x="0" y="32" fill="#475569">0  0 → 0</text><text x="0" y="62" fill="#475569">0  1 → 0</text><text x="0" y="92" fill="#475569">1  0 → 0</text><text x="0" y="122" fill="#15803d">1  1 → 1</text>
  </g>
  <g transform="translate(190 75)">
   <rect width="285" height="230" rx="10" fill="#fff" stroke="#d8e1ed"/>
   <line x1="55" y1="185" x2="245" y2="185" stroke="#94a3b8" stroke-width="2"/><line x1="55" y1="185" x2="55" y2="35" stroke="#94a3b8" stroke-width="2"/>
   <circle cx="75" cy="165" r="11" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="75" cy="60" r="11" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="205" cy="165" r="11" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="205" cy="60" r="11" fill="#2563eb"/>
   <line x1="125" y1="180" x2="240" y2="55" stroke="#16a34a" stroke-width="5"/>
   <text x="95" y="215" font-size="18" font-weight="700" fill="#15803d">직선 하나로 분리 가능</text>
  </g>
  <text x="260" y="360" text-anchor="middle" font-size="18" fill="#475569">→ Perceptron 하나로 표현 가능</text>
 </g>
 <g transform="translate(625 135)">
  <rect width="520" height="390" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="24" font-weight="700" fill="#be123c">XOR</text>
  <g transform="translate(25 70)" font-size="18">
   <text x="0" y="0" font-weight="700" fill="#475569">x₁ x₂ → y</text>
   <text x="0" y="32" fill="#475569">0  0 → 0</text><text x="0" y="62" fill="#2563eb">0  1 → 1</text><text x="0" y="92" fill="#2563eb">1  0 → 1</text><text x="0" y="122" fill="#475569">1  1 → 0</text>
  </g>
  <g transform="translate(190 75)">
   <rect width="285" height="230" rx="10" fill="#fff" stroke="#d8e1ed"/>
   <line x1="55" y1="185" x2="245" y2="185" stroke="#94a3b8" stroke-width="2"/><line x1="55" y1="185" x2="55" y2="35" stroke="#94a3b8" stroke-width="2"/>
   <circle cx="75" cy="165" r="11" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="75" cy="60" r="11" fill="#2563eb"/><circle cx="205" cy="165" r="11" fill="#2563eb"/><circle cx="205" cy="60" r="11" fill="#fff" stroke="#334155" stroke-width="3"/>
   <path d="M50 120 C85 35 210 35 245 120 C210 205 85 205 50 120Z" fill="none" stroke="#e11d48" stroke-width="5" stroke-dasharray="10 8"/>
   <text x="70" y="215" font-size="18" font-weight="700" fill="#be123c">직선 하나로는 불가능</text>
  </g>
  <text x="260" y="360" text-anchor="middle" font-size="18" fill="#475569">→ 여러 계산 + 비선형성이 필요</text>
 </g>
</g>
</svg>