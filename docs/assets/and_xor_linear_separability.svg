<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<rect width="1400" height="620" fill="#fff"/>
<style>
.t{font:700 30px Arial,sans-serif;fill:#111827}.h{font:700 22px Arial,sans-serif;fill:#111827}.s{font:400 15px Arial,sans-serif;fill:#64748b}
.axis{stroke:#94a3b8;stroke-width:2}.grid{stroke:#e2e8f0;stroke-width:1}.line{stroke:#2563eb;stroke-width:4}
.zero{fill:#fff;stroke:#64748b;stroke-width:3}.one{fill:#2563eb;stroke:#2563eb;stroke-width:3}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}
</style>
<text x="700" y="44" text-anchor="middle" class="t">AND는 직선 하나로 나눌 수 있지만, XOR는 나눌 수 없다</text>

<g transform="translate(60 95)">
<rect width="600" height="450" rx="22" class="box"/>
<text x="300" y="38" text-anchor="middle" class="h">AND Gate — Linearly Separable</text>
<text x="300" y="65" text-anchor="middle" class="s">1은 (1,1) 하나뿐이므로 직선 하나로 분리 가능</text>

<g transform="translate(115 105)">
<line x1="35" y1="300" x2="370" y2="300" class="axis"/><line x1="35" y1="300" x2="35" y2="0" class="axis"/>
<line x1="35" y1="150" x2="370" y2="150" class="grid"/><line x1="202" y1="300" x2="202" y2="0" class="grid"/>
<text x="25" y="320" class="s">0</text><text x="194" y="320" class="s">1</text><text x="5" y="305" class="s">0</text><text x="5" y="155" class="s">1</text>
<circle cx="35" cy="300" r="13" class="zero"/><circle cx="202" cy="300" r="13" class="zero"/><circle cx="35" cy="150" r="13" class="zero"/><circle cx="202" cy="150" r="13" class="one"/>
<line x1="80" y1="80" x2="300" y2="275" class="line"/>
<text x="290" y="70" class="s">결정 경계</text>
</g>
</g>

<g transform="translate(740 95)">
<rect width="600" height="450" rx="22" class="box"/>
<text x="300" y="38" text-anchor="middle" class="h">XOR Gate — Not Linearly Separable</text>
<text x="300" y="65" text-anchor="middle" class="s">1이 대각선으로 떨어져 있어 직선 하나로 분리 불가</text>

<g transform="translate(115 105)">
<line x1="35" y1="300" x2="370" y2="300" class="axis"/><line x1="35" y1="300" x2="35" y2="0" class="axis"/>
<line x1="35" y1="150" x2="370" y2="150" class="grid"/><line x1="202" y1="300" x2="202" y2="0" class="grid"/>
<text x="25" y="320" class="s">0</text><text x="194" y="320" class="s">1</text><text x="5" y="305" class="s">0</text><text x="5" y="155" class="s">1</text>
<circle cx="35" cy="300" r="13" class="zero"/><circle cx="202" cy="300" r="13" class="one"/><circle cx="35" cy="150" r="13" class="one"/><circle cx="202" cy="150" r="13" class="zero"/>
<line x1="75" y1="70" x2="300" y2="275" class="line" opacity=".35"/>
<text x="290" y="65" class="s">어떤 직선을 그어도 실패</text>
</g>
</g>

<text x="700" y="590" text-anchor="middle" class="s">● = Output 1, ○ = Output 0</text>
</svg>