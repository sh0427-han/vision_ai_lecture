<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">모델 이름보다 먼저 “무엇을 출력해야 문제를 해결하는가?”를 정합니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">원하는 Output이 정해지면 Vision Task, Label 형태, Model과 Metric 선택이 자연스럽게 이어집니다.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g transform="translate(45 185)"><rect width="180" height="180" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="42" font-size="20" font-weight="700" fill="#17243b">① 현장 질문</text><text x="90" y="92" font-size="18" fill="#475569">“결함 면적을</text><text x="90" y="120" font-size="18" fill="#475569">알고 싶다”</text></g>
 <g transform="translate(275 185)"><rect width="180" height="180" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/><text x="90" y="42" font-size="20" font-weight="700" fill="#4338ca">② 원하는 Output</text><text x="90" y="92" font-size="18" fill="#475569">결함 Pixel 영역</text><text x="90" y="126" font-size="18" font-weight="700" fill="#4338ca">Mask</text></g>
 <g transform="translate(505 185)"><rect width="180" height="180" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="90" y="42" font-size="20" font-weight="700" fill="#1d4ed8">③ Vision Task</text><text x="90" y="100" font-size="19" font-weight="700" fill="#1d4ed8">Segmentation</text></g>
 <g transform="translate(735 185)"><rect width="180" height="180" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="90" y="42" font-size="20" font-weight="700" fill="#9a3412">④ Label</text><text x="90" y="92" font-size="18" fill="#475569">Pixel Mask</text><text x="90" y="126" font-size="18" fill="#475569">정답 기준 정의</text></g>
 <g transform="translate(965 185)"><rect width="190" height="180" rx="18" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/><text x="95" y="42" font-size="20" font-weight="700" fill="#15803d">⑤ Model / Metric</text><text x="95" y="92" font-size="18" fill="#475569">Segmentation Model</text><text x="95" y="126" font-size="18" fill="#475569">IoU · Dice</text></g>
</g>
<g stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M230 275H265"/><path d="M460 275H495"/><path d="M690 275H725"/><path d="M920 275H955"/></g>
<rect x="250" y="445" width="700" height="65" rx="14" fill="#eef6ff"/>
<text x="600" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17243b">Classification / Detection / Segmentation은 Model 이름이 아니라 “필요한 Output”을 정의하는 Task입니다.</text>
</svg>