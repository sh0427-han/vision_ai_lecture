<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">위치를 예측하는 Task는 “정답과 Prediction이 얼마나 겹치는가?”가 중요합니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">IoU(Intersection over Union)는 겹친 영역을 전체 합집합 영역으로 나눈 값입니다. 1에 가까울수록 더 잘 겹칩니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(70 150)">
  <rect width="500" height="360" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="23" font-weight="700" fill="#1d4ed8">Detection · Box IoU</text>
  <rect x="95" y="100" width="210" height="150" fill="#dbeafe" fill-opacity=".55" stroke="#2563eb" stroke-width="5"/>
  <rect x="190" y="145" width="210" height="150" fill="#ffedd5" fill-opacity=".55" stroke="#f97316" stroke-width="5"/>
  <rect x="190" y="145" width="115" height="105" fill="#dcfce7" fill-opacity=".8" stroke="#16a34a" stroke-width="2"/>
  <text x="115" y="88" font-size="18" fill="#1d4ed8">Ground Truth</text>
  <text x="278" y="325" font-size="18" fill="#ea580c">Prediction</text>
  <text x="248" y="205" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">Intersection</text>
 </g>
 <g transform="translate(630 150)">
  <rect width="500" height="360" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="23" font-weight="700" fill="#15803d">Segmentation · Mask IoU</text>
  <path d="M110 255 C75 190 95 105 170 95 C240 85 300 120 305 180 C310 245 255 290 185 292 C150 293 125 280 110 255Z" fill="#dbeafe" fill-opacity=".65" stroke="#2563eb" stroke-width="4"/>
  <path d="M190 270 C150 230 155 145 220 120 C290 92 360 130 375 190 C390 250 340 305 275 310 C240 313 210 295 190 270Z" fill="#ffedd5" fill-opacity=".65" stroke="#f97316" stroke-width="4"/>
  <path d="M190 270 C163 242 164 181 205 143 C245 111 294 119 320 152 C340 185 325 238 290 270 C260 295 220 293 190 270Z" fill="#dcfce7" fill-opacity=".82"/>
  <text x="115" y="95" font-size="18" fill="#1d4ed8">Ground Truth Mask</text>
  <text x="280" y="335" font-size="18" fill="#ea580c">Prediction Mask</text>
 </g>
 <rect x="300" y="525" width="600" height="48" rx="12" fill="#eef6ff"/>
 <text x="600" y="556" text-anchor="middle" font-size="20" font-weight="700" fill="#17243b">IoU = Intersection ÷ Union · 완전 일치하면 1.0</text>
</g>
</svg>