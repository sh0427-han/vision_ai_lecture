<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">현장 질문이 필요한 Vision Task를 결정합니다</text>
<rect x="85" y="115" width="390" height="280" rx="20" class="blue"/><text x="280" y="153" text-anchor="middle" class="h">정상 / 불량인가?</text><text x="280" y="180" text-anchor="middle" class="s">이미지 전체의 상태</text><text x="280" y="300" text-anchor="middle" class="h">Classification</text><text x="280" y="335" text-anchor="middle" class="s">Class / Probability</text>
<rect x="555" y="115" width="390" height="280" rx="20" class="green"/><text x="750" y="153" text-anchor="middle" class="h">불량이 어디에 있는가?</text><text x="750" y="180" text-anchor="middle" class="s">대략적인 위치</text><text x="750" y="300" text-anchor="middle" class="h">Detection</text><text x="750" y="335" text-anchor="middle" class="s">Bounding Box</text>
<rect x="1025" y="115" width="390" height="280" rx="20" class="red"/><text x="1220" y="153" text-anchor="middle" class="h">면적·형상이 필요한가?</text><text x="1220" y="180" text-anchor="middle" class="s">정확한 관심 영역</text><text x="1220" y="300" text-anchor="middle" class="h">Segmentation</text><text x="1220" y="335" text-anchor="middle" class="s">Pixel Mask / Area</text></svg>