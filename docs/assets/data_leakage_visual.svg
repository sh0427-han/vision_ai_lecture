<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="대표적인 Data Leakage 세 가지를 보여주는 그림">
<defs><marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e11d48"/></marker></defs>
<rect width="1200" height="600" rx="28" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#17243b">Data Leakage = 평가할 때 “몰라야 하는 정보”가 학습 과정에 들어온 상태</text>
<text x="60" y="100" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">성능이 실제보다 좋아 보일 수 있어, Split 이후 정보 흐름을 통제해야 합니다.</text>

<g transform="translate(55 145)" font-family="Arial, Noto Sans KR, sans-serif">
  <g transform="translate(0 0)">
    <rect width="340" height="365" rx="20" fill="#fff" stroke="#fecdd3" stroke-width="3"/>
    <text x="24" y="42" font-size="21" font-weight="700" fill="#be123c">① 같은 원본이 양쪽에</text>
    <rect x="28" y="82" width="80" height="70" rx="10" fill="#dbeafe"/><text x="68" y="122" text-anchor="middle" font-size="18" fill="#1d4ed8">Video A</text>
    <path d="M110 116H165" stroke="#64748b" stroke-width="4"/>
    <rect x="175" y="72" width="130" height="58" rx="10" fill="#e0f2fe"/><text x="240" y="108" text-anchor="middle" font-size="17" fill="#0369a1">Train frame 101</text>
    <rect x="175" y="145" width="130" height="58" rx="10" fill="#dcfce7"/><text x="240" y="181" text-anchor="middle" font-size="17" fill="#15803d">Val frame 102</text>
    <path d="M240 215v48" stroke="#e11d48" stroke-width="5" marker-end="url(#redArrow)"/>
    <text x="170" y="300" font-size="18" font-weight="700" fill="#be123c">거의 같은 장면</text>
    <text x="170" y="330" font-size="17" fill="#64748b">이미 본 것과 비슷해짐</text>
  </g>

  <g transform="translate(375 0)">
    <rect width="340" height="365" rx="20" fill="#fff" stroke="#fecdd3" stroke-width="3"/>
    <text x="24" y="42" font-size="21" font-weight="700" fill="#be123c">② 전체 데이터로 전처리</text>
    <rect x="40" y="85" width="260" height="58" rx="10" fill="#f1f5f9"/><text x="170" y="121" text-anchor="middle" font-size="18" fill="#334155">Train + Val + Test</text>
    <path d="M170 150v42" stroke="#e11d48" stroke-width="5" marker-end="url(#redArrow)"/>
    <rect x="65" y="205" width="210" height="68" rx="12" fill="#fff1f2"/><text x="170" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#be123c">Mean / Std 계산</text><text x="170" y="258" text-anchor="middle" font-size="16" fill="#64748b">Test 정보 포함</text>
    <text x="55" y="323" font-size="17" fill="#64748b">전처리 통계도 Train에서 계산</text>
  </g>

  <g transform="translate(750 0)">
    <rect width="340" height="365" rx="20" fill="#fff" stroke="#fecdd3" stroke-width="3"/>
    <text x="24" y="42" font-size="21" font-weight="700" fill="#be123c">③ Test를 보며 계속 수정</text>
    <rect x="45" y="82" width="105" height="62" rx="10" fill="#e0f2fe"/><text x="98" y="120" text-anchor="middle" font-size="18" fill="#0369a1">Model</text>
    <rect x="190" y="82" width="105" height="62" rx="10" fill="#fef3c7"/><text x="242" y="120" text-anchor="middle" font-size="18" fill="#92400e">Test</text>
    <path d="M152 112h28" stroke="#64748b" stroke-width="4" marker-end="url(#redArrow)"/>
    <path d="M242 152 C242 215 98 215 98 153" fill="none" stroke="#e11d48" stroke-width="5" marker-end="url(#redArrow)"/>
    <text x="53" y="252" font-size="18" font-weight="700" fill="#be123c">Test Score 확인 → 수정 반복</text>
    <text x="53" y="287" font-size="17" fill="#64748b">Test가 사실상 Validation이 됨</text>
  </g>
</g>
</svg>