<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Activation Function은 Network에 “꺾임”을 넣어 복잡한 Pattern을 표현하게 합니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">대표적인 ReLU는 매우 단순하지만 여러 Layer 사이에 들어가면 강력한 비선형 표현을 만듭니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(70 150)">
  <rect width="330" height="350" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="24" font-weight="700" fill="#1d4ed8">ReLU</text>
  <line x1="60" y1="270" x2="285" y2="270" stroke="#94a3b8" stroke-width="2"/><line x1="165" y1="300" x2="165" y2="80" stroke="#94a3b8" stroke-width="2"/>
  <path d="M65 270H165L280 110" fill="none" stroke="#2563eb" stroke-width="6"/>
  <text x="55" y="325" font-size="18" fill="#475569">x&lt;0 → 0</text><text x="205" y="325" font-size="18" fill="#475569">x&gt;0 → x</text>
 </g>
 <g transform="translate(440 150)">
  <rect width="300" height="350" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="22" font-weight="700" fill="#be123c">Activation 없음</text>
  <circle cx="85" cy="120" r="12" fill="#2563eb"/><circle cx="215" cy="230" r="12" fill="#2563eb"/><circle cx="85" cy="230" r="12" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="215" cy="120" r="12" fill="#fff" stroke="#334155" stroke-width="3"/>
  <line x1="55" y1="270" x2="245" y2="80" stroke="#e11d48" stroke-width="5" stroke-dasharray="10 8"/>
  <text x="150" y="320" text-anchor="middle" font-size="18" fill="#be123c">직선 경계만 가능</text>
 </g>
 <g transform="translate(780 150)">
  <rect width="350" height="350" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="25" y="42" font-size="22" font-weight="700" fill="#15803d">Activation 있음</text>
  <circle cx="90" cy="120" r="12" fill="#2563eb"/><circle cx="245" cy="230" r="12" fill="#2563eb"/><circle cx="90" cy="230" r="12" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="245" cy="120" r="12" fill="#fff" stroke="#334155" stroke-width="3"/>
  <path d="M55 180H165V275H300" fill="none" stroke="#16a34a" stroke-width="6"/>
  <text x="175" y="320" text-anchor="middle" font-size="18" fill="#15803d">꺾인 경계 조합 가능</text>
 </g>
</g>
</svg>