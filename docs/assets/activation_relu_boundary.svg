<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="ReLU와 비선형 결정 경계를 설명하는 그림">
<rect width="1200" height="600" rx="28" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#17243b">Activation Function이 들어가면 표현할 수 있는 경계가 달라집니다</text>
<text x="60" y="100" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">ReLU는 음수를 0으로 만들고, 양수는 그대로 통과시키는 대표적인 비선형 함수입니다.</text>

<g transform="translate(70 145)">
  <rect width="330" height="360" rx="20" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
  <text x="28" y="42" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#17243b">ReLU</text>
  <line x1="60" y1="285" x2="285" y2="285" stroke="#64748b" stroke-width="3"/>
  <line x1="165" y1="320" x2="165" y2="80" stroke="#64748b" stroke-width="3"/>
  <path d="M60 285 H165 L280 120" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <text x="74" y="330" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">x &lt; 0 → 0</text>
  <text x="186" y="330" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">x &gt; 0 → x</text>
</g>

<g transform="translate(435 145)">
  <rect width="315" height="360" rx="20" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
  <text x="28" y="42" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#17243b">Activation 없음</text>
  <circle cx="95" cy="120" r="14" fill="#2563eb"/><circle cx="216" cy="226" r="14" fill="#2563eb"/>
  <circle cx="95" cy="230" r="14" fill="#fff" stroke="#334155" stroke-width="4"/><circle cx="220" cy="118" r="14" fill="#fff" stroke="#334155" stroke-width="4"/>
  <line x1="60" y1="285" x2="260" y2="75" stroke="#e11d48" stroke-width="5" stroke-dasharray="12 9"/>
  <text x="66" y="325" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#be123c">직선 하나로는 부족</text>
</g>

<g transform="translate(785 145)">
  <rect width="345" height="360" rx="20" fill="#fff" stroke="#d8e1ed" stroke-width="2"/>
  <text x="28" y="42" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#17243b">Activation 있음</text>
  <circle cx="98" cy="120" r="14" fill="#2563eb"/><circle cx="235" cy="230" r="14" fill="#2563eb"/>
  <circle cx="100" cy="235" r="14" fill="#fff" stroke="#334155" stroke-width="4"/><circle cx="238" cy="118" r="14" fill="#fff" stroke="#334155" stroke-width="4"/>
  <path d="M52 182 H168 V286 H292" fill="none" stroke="#16a34a" stroke-width="7" stroke-linejoin="round"/>
  <text x="52" y="325" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#15803d">꺾인 비선형 경계 표현 가능</text>
</g>
</svg>