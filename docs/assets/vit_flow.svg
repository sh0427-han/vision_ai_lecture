<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470"><rect width="1400" height="470" fill="#fff"/><style>.t{font:700 27px Arial;fill:#111827}.l{font:600 18px Arial;fill:#111827}.s{font:400 14px Arial;fill:#475569}.b{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.a{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.g{fill:#f0fdf4;stroke:#86efac;stroke-width:2}.line{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="700" y="48" text-anchor="middle" class="t">Vision Transformer: Image → Patch → Token → Attention</text><g transform="translate(25 130)"><rect width="165" height="100" rx="15" class="b"/><text x="82" y="40" text-anchor="middle" class="l">Image</text><text x="82" y="68" text-anchor="middle" class="s">224×224×3</text></g><line x1="190" y1="180" x2="235" y2="180" class="line"/><g transform="translate(240 130)"><rect width="165" height="100" rx="15" class="a"/><text x="82" y="40" text-anchor="middle" class="l">Patch Split</text><text x="82" y="68" text-anchor="middle" class="s">16×16 → 196</text></g><line x1="405" y1="180" x2="450" y2="180" class="line"/><g transform="translate(455 130)"><rect width="165" height="100" rx="15" class="b"/><text x="82" y="40" text-anchor="middle" class="l">Embedding</text><text x="82" y="68" text-anchor="middle" class="s">Patch → Vector</text></g><line x1="620" y1="180" x2="665" y2="180" class="line"/><g transform="translate(670 130)"><rect width="165" height="100" rx="15" class="g"/><text x="82" y="34" text-anchor="middle" class="l">+ Position</text><text x="82" y="62" text-anchor="middle" class="s">+ CLS Token</text></g><line x1="835" y1="180" x2="880" y2="180" class="line"/><g transform="translate(885 130)"><rect width="190" height="100" rx="15" class="a"/><text x="95" y="34" text-anchor="middle" class="l">Self-Attention</text><text x="95" y="62" text-anchor="middle" class="s">Q · K → Weight</text><text x="95" y="82" text-anchor="middle" class="s">Weight × V</text></g><line x1="1075" y1="180" x2="1120" y2="180" class="line"/><g transform="translate(1125 130)"><rect width="165" height="100" rx="15" class="b"/><text x="82" y="34" text-anchor="middle" class="l">Encoder</text><text x="82" y="62" text-anchor="middle" class="s">Attention + MLP</text></g><line x1="1290" y1="180" x2="1330" y2="180" class="line"/><text x="1360" y="173" text-anchor="middle" class="l">Class</text><text x="700" y="315" text-anchor="middle" class="l">224×224 이미지를 16×16 Patch로 나누면 196개의 Patch Token이 된다.</text><text x="700" y="350" text-anchor="middle" class="s">각 Token은 다른 Token과의 관계를 Self-Attention으로 계산하며 새로운 Feature를 만든다.</text></svg>