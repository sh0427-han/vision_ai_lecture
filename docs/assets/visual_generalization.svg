<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">달라지는 Pixel 속에서, 변하지 않는 의미를 배웁니다</text>
<rect x="65" y="110" width="590" height="390" rx="20" class="soft"/><text x="360" y="148" text-anchor="middle" class="h">다양한 입력</text><text x="360" y="175" text-anchor="middle" class="s">조명 · 시점 · 크기 · 가림 · 흐림</text>
<g transform="translate(110 190)"><circle cx="65" cy="80" r="45" fill="#ef4444"/><circle cx="180" cy="80" r="45" fill="#991b1b"/><circle cx="295" cy="80" r="32" fill="#ef4444"/><path d="M410 45 C450 35,460 125,410 115 C385 105,385 60,410 45" fill="#ef4444"/><circle cx="525" cy="80" r="45" fill="#ef4444" opacity=".45"/><text x="65" y="155" text-anchor="middle" class="xs">밝음</text><text x="180" y="155" text-anchor="middle" class="xs">어두움</text><text x="295" y="155" text-anchor="middle" class="xs">작음</text><text x="410" y="155" text-anchor="middle" class="xs">가림</text><text x="525" y="155" text-anchor="middle" class="xs">흐림</text></g>
<path d="M680 305 L800 305" class="arrow"/><text x="740" y="275" text-anchor="middle" class="m">학습</text>
<rect x="845" y="110" width="590" height="390" rx="20" class="blue"/><text x="1140" y="148" text-anchor="middle" class="h">공통된 Feature</text><text x="1140" y="175" text-anchor="middle" class="s">색 · 윤곽 · 꼭지 · 질감</text>
<circle cx="1135" cy="280" r="105" fill="#ef4444"/><rect x="1125" y="150" width="18" height="60" rx="6" fill="#7c2d12"/><ellipse cx="1180" cy="175" rx="44" ry="18" fill="#65a30d" transform="rotate(-20 1180 175)"/><text x="1135" y="435" text-anchor="middle" class="h">Apple</text>
<text x="750" y="570" text-anchor="middle" class="h">Generalization = 처음 보는 조건에서도 같은 의미를 올바르게 판단하는 능력</text></svg>