<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Training은 네 단계를 반복하면서 Weight를 조금씩 개선하는 과정입니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">한 Batch를 처리할 때마다 Forward → Loss → Backward → Update가 반복됩니다.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g transform="translate(70 175)"><rect width="230" height="170" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="115" y="42" font-size="22" font-weight="700" fill="#1d4ed8">① Forward</text><text x="115" y="82" font-size="18" fill="#475569">Image → Model</text><text x="115" y="112" font-size="18" fill="#475569">→ Prediction</text><text x="115" y="145" font-size="17" fill="#64748b">예측을 만듦</text></g>
 <g transform="translate(345 175)"><rect width="230" height="170" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="115" y="42" font-size="22" font-weight="700" fill="#9a3412">② Loss</text><text x="115" y="82" font-size="18" fill="#475569">Prediction</text><text x="115" y="112" font-size="18" fill="#475569">↔ Target</text><text x="115" y="145" font-size="17" fill="#64748b">얼마나 틀렸는지 계산</text></g>
 <g transform="translate(620 175)"><rect width="230" height="170" rx="20" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/><text x="115" y="42" font-size="22" font-weight="700" fill="#be123c">③ Backward</text><text x="115" y="82" font-size="18" fill="#475569">Gradient</text><text x="115" y="112" font-size="18" fill="#475569">계산</text><text x="115" y="145" font-size="17" fill="#64748b">각 Weight의 영향 계산</text></g>
 <g transform="translate(895 175)"><rect width="230" height="170" rx="20" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/><text x="115" y="42" font-size="22" font-weight="700" fill="#15803d">④ Update</text><text x="115" y="82" font-size="18" fill="#475569">Optimizer가</text><text x="115" y="112" font-size="18" fill="#475569">Weight 수정</text><text x="115" y="145" font-size="17" fill="#64748b">다음 Prediction 개선</text></g>
</g>
<g stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M305 260H335"/><path d="M580 260H610"/><path d="M855 260H885"/><path d="M1010 355 C1010 480 185 480 185 355"/></g>
<text x="600" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#2563eb">다음 Batch에서 다시 반복</text>
</svg>