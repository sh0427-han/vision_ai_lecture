<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
  <rect width="1400" height="520" fill="#ffffff"/>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#111827}
    .label{font:700 18px Arial,sans-serif;fill:#111827}
    .small{font:400 14px Arial,sans-serif;fill:#64748b}
    .box{fill:#ffffff;stroke:#dbe2ea;stroke-width:2}
    .accent{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}
    .green{fill:#f0fdf4;stroke:#86efac;stroke-width:2}
    .orange{fill:#fff7ed;stroke:#fdba74;stroke-width:2}
    .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <text x="700" y="44" text-anchor="middle" class="title">학습은 “정답에 더 가까워지도록 Weight를 반복 수정하는 과정”이다</text>
  <g transform="translate(55 150)"><rect width="190" height="110" rx="16" class="box"/><text x="95" y="42" text-anchor="middle" class="label">Input + Label</text><text x="95" y="72" text-anchor="middle" class="small">Image + 정답</text></g>
  <path d="M245 205 L320 205" class="arrow"/>
  <g transform="translate(325 150)"><rect width="190" height="110" rx="16" class="accent"/><text x="95" y="42" text-anchor="middle" class="label">Forward</text><text x="95" y="72" text-anchor="middle" class="small">현재 Weight로 예측</text></g>
  <path d="M515 205 L590 205" class="arrow"/>
  <g transform="translate(595 150)"><rect width="190" height="110" rx="16" class="orange"/><text x="95" y="42" text-anchor="middle" class="label">Loss</text><text x="95" y="72" text-anchor="middle" class="small">예측과 정답의 차이</text></g>
  <path d="M785 205 L860 205" class="arrow"/>
  <g transform="translate(865 150)"><rect width="190" height="110" rx="16" class="box"/><text x="95" y="42" text-anchor="middle" class="label">Backward</text><text x="95" y="72" text-anchor="middle" class="small">Gradient 계산</text></g>
  <path d="M1055 205 L1130 205" class="arrow"/>
  <g transform="translate(1135 150)"><rect width="210" height="110" rx="16" class="green"/><text x="105" y="42" text-anchor="middle" class="label">Optimizer Step</text><text x="105" y="72" text-anchor="middle" class="small">Weight Update</text></g>
  <path d="M1240 260 C1240 375,420 410,420 270" class="arrow"/>
  <text x="700" y="420" text-anchor="middle" class="small">이 반복을 Mini-batch마다 수행하고, 전체 Train Dataset을 한 번 훑으면 1 Epoch가 된다.</text>
</svg>