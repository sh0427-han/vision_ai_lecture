<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">예측에서 가중치 갱신까지의 학습 루프</title>
  <desc id="desc">입력으로 예측을 계산하고 Loss와 Gradient를 구해 Optimizer가 Weight를 수정하는 반복 과정.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9Z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}
    .title{font-size:30px;font-weight:800;fill:#17243b}
    .step{font-size:23px;font-weight:800;fill:#17243b}
    .body{font-size:18px;fill:#53647b}
    .num{font-size:14px;font-weight:800;fill:#2563eb}
    .foot{font-size:17px;fill:#53647b}
  </style>
  <rect width="1200" height="600" fill="#fff"/>
  <text x="42" y="58" class="title">예측 → Loss → Gradient → Parameter Update</text>
  <line x1="42" y1="80" x2="1158" y2="80" stroke="#d8e1ed"/>

  <g>
    <rect x="42" y="135" width="240" height="310" rx="18" fill="#f8fafc" stroke="#d8e1ed" stroke-width="2"/>
    <text x="64" y="169" class="num">01</text>
    <text x="64" y="211" class="step">Forward</text>
    <rect x="81" y="247" width="162" height="76" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="162" y="279" class="body" text-anchor="middle">Model</text>
    <text x="162" y="304" class="body" text-anchor="middle">Prediction ŷ</text>
    <text x="162" y="379" class="body" text-anchor="middle">입력으로 예측 계산</text>
  </g>

  <g>
    <rect x="326" y="135" width="240" height="310" rx="18" fill="#f8fafc" stroke="#d8e1ed" stroke-width="2"/>
    <text x="348" y="169" class="num">02</text>
    <text x="348" y="211" class="step">Loss</text>
    <rect x="365" y="247" width="162" height="76" rx="12" fill="#ecfdf5" stroke="#087f74"/>
    <text x="446" y="279" class="body" text-anchor="middle">Prediction ↔ Target</text>
    <text x="446" y="304" class="body" text-anchor="middle">Error</text>
    <text x="446" y="379" class="body" text-anchor="middle">틀린 정도를 숫자로 계산</text>
  </g>

  <g>
    <rect x="610" y="135" width="240" height="310" rx="18" fill="#f8fafc" stroke="#d8e1ed" stroke-width="2"/>
    <text x="632" y="169" class="num">03</text>
    <text x="632" y="211" class="step">Backward</text>
    <rect x="649" y="247" width="162" height="76" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="730" y="279" class="body" text-anchor="middle">Gradient</text>
    <text x="730" y="304" class="body" text-anchor="middle">∂L / ∂w</text>
    <text x="730" y="379" class="body" text-anchor="middle">각 Weight의 영향 계산</text>
  </g>

  <g>
    <rect x="894" y="135" width="240" height="310" rx="18" fill="#f8fafc" stroke="#d8e1ed" stroke-width="2"/>
    <text x="916" y="169" class="num">04</text>
    <text x="916" y="211" class="step">Optimizer</text>
    <rect x="933" y="247" width="162" height="76" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="1014" y="279" class="body" text-anchor="middle">w ← w − η∇L</text>
    <text x="1014" y="304" class="body" text-anchor="middle">Weight Update</text>
    <text x="1014" y="379" class="body" text-anchor="middle">Loss가 줄도록 값 수정</text>
  </g>

  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M287 290 H314"/>
    <path d="M571 290 H598"/>
    <path d="M855 290 H882"/>
  </g>
  <path d="M1014 454 V492 H162 V454" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="588" y="520" class="body" text-anchor="middle">다음 Mini-batch에서 같은 과정을 반복</text>

  <rect x="42" y="544" width="1092" height="38" rx="10" fill="#edf3fc"/>
  <text x="588" y="569" class="foot" text-anchor="middle">핵심: 예측 → 오차 계산 → 기울기 계산 → Parameter 수정</text>
</svg>