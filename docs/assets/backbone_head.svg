<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Backbone은 공통 Feature를 만들고, Head는 Task에 맞는 Output을 만듭니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">모든 Model이 정확히 같은 구조는 아니지만, 처음 Architecture를 읽을 때 유용한 관점입니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(55 170)">
  <rect width="180" height="220" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#17243b">Input</text>
  <circle cx="90" cy="120" r="55" fill="#ef4444"/><ellipse cx="115" cy="64" rx="25" ry="12" fill="#16a34a" transform="rotate(-25 115 64)"/>
  <text x="90" y="195" text-anchor="middle" font-size="18" fill="#475569">Image Tensor</text>
 </g>
 <path d="M250 280H320" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
 <g transform="translate(340 145)">
  <rect width="360" height="270" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="180" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">Backbone</text>
  <text x="180" y="75" text-anchor="middle" font-size="18" fill="#475569">공통 Feature 추출</text>
  <g transform="translate(35 105)">
   <rect width="65" height="110" rx="8" fill="#dbeafe"/><rect x="80" y="15" width="65" height="95" rx="8" fill="#bfdbfe"/><rect x="160" y="30" width="65" height="80" rx="8" fill="#93c5fd"/><rect x="240" y="45" width="65" height="65" rx="8" fill="#60a5fa"/>
   <text x="32" y="140" font-size="18" fill="#475569">Edge</text><text x="112" y="140" font-size="18" fill="#475569">Texture</text><text x="192" y="140" font-size="18" fill="#475569">Part</text><text x="270" y="140" font-size="18" fill="#475569">Feature</text>
  </g>
 </g>
 <path d="M715 280H770" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
 <g transform="translate(790 130)">
  <text x="160" y="22" text-anchor="middle" font-size="24" font-weight="700" fill="#17243b">Task Head</text>
  <rect y="55" width="320" height="95" rx="16" fill="#eef2ff" stroke="#c7d2fe"/><text x="20" y="90" font-size="19" font-weight="700" fill="#4338ca">Classification Head</text><text x="20" y="120" font-size="18" fill="#475569">→ Class Score</text>
  <rect y="165" width="320" height="95" rx="16" fill="#fff7ed" stroke="#fed7aa"/><text x="20" y="200" font-size="19" font-weight="700" fill="#9a3412">Detection Head</text><text x="20" y="230" font-size="18" fill="#475569">→ Class + Bounding Box</text>
  <rect y="275" width="320" height="95" rx="16" fill="#ecfdf5" stroke="#bbf7d0"/><text x="20" y="310" font-size="19" font-weight="700" fill="#15803d">Segmentation Head</text><text x="20" y="340" font-size="18" fill="#475569">→ Pixel Mask</text>
 </g>
</g>
</svg>