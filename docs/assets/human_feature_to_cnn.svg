<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <rect width="1400" height="560" fill="#ffffff"/>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#111827}
    .label{font:700 20px Arial,sans-serif;fill:#111827}
    .small{font:400 15px Arial,sans-serif;fill:#64748b}
    .box{fill:#ffffff;stroke:#dbe2ea;stroke-width:2}
    .soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}
    .accent{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}
    .arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="700" y="45" text-anchor="middle" class="title">사람의 직관과 CNN의 공통점: 작은 특징을 조합해 의미를 만든다</text>

  <g transform="translate(55 105)">
    <rect width="600" height="365" rx="22" class="box"/>
    <text x="300" y="42" text-anchor="middle" class="label">사람이 사과를 알아볼 때</text>

    <g transform="translate(55 92)">
      <circle cx="45" cy="45" r="34" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
      <text x="45" y="98" text-anchor="middle" class="small">빨간색</text>
    </g>
    <g transform="translate(180 92)">
      <circle cx="45" cy="45" r="34" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
      <circle cx="45" cy="45" r="22" fill="none" stroke="#9a3412" stroke-width="3"/>
      <text x="45" y="98" text-anchor="middle" class="small">둥근 형태</text>
    </g>
    <g transform="translate(305 92)">
      <rect x="39" y="11" width="12" height="35" rx="5" fill="#65a30d"/>
      <circle cx="45" cy="60" r="28" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
      <text x="45" y="108" text-anchor="middle" class="small">꼭지</text>
    </g>
    <g transform="translate(430 92)">
      <circle cx="45" cy="45" r="34" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
      <circle cx="35" cy="38" r="3" fill="#7f1d1d"/><circle cx="53" cy="51" r="3" fill="#7f1d1d"/>
      <circle cx="48" cy="31" r="2" fill="#7f1d1d"/>
      <text x="45" y="98" text-anchor="middle" class="small">표면 질감</text>
    </g>

    <path d="M105 225 L490 225" class="arrow"/>
    <rect x="165" y="250" width="270" height="72" rx="14" class="accent"/>
    <text x="300" y="280" text-anchor="middle" class="label">특징을 종합</text>
    <text x="300" y="305" text-anchor="middle" class="small">“이 특징 조합이면 사과일 가능성이 높다”</text>
  </g>

  <g transform="translate(745 105)">
    <rect width="600" height="365" rx="22" class="box"/>
    <text x="300" y="42" text-anchor="middle" class="label">CNN이 이미지를 처리할 때</text>

    <rect x="42" y="92" width="105" height="72" rx="12" class="soft"/>
    <text x="95" y="121" text-anchor="middle" class="label">Pixel</text>
    <text x="95" y="145" text-anchor="middle" class="small">숫자 배열</text>

    <path d="M147 128 L197 128" class="arrow"/>

    <rect x="202" y="92" width="105" height="72" rx="12" class="soft"/>
    <text x="255" y="121" text-anchor="middle" class="label">Edge</text>
    <text x="255" y="145" text-anchor="middle" class="small">경계</text>

    <path d="M307 128 L357 128" class="arrow"/>

    <rect x="362" y="92" width="105" height="72" rx="12" class="soft"/>
    <text x="415" y="121" text-anchor="middle" class="label">Texture</text>
    <text x="415" y="145" text-anchor="middle" class="small">질감</text>

    <path d="M467 128 L517 128" class="arrow"/>

    <rect x="522" y="92" width="55" height="72" rx="12" class="accent"/>
    <text x="550" y="121" text-anchor="middle" class="label">…</text>

    <path d="M300 182 L300 232" class="arrow"/>
    <rect x="145" y="238" width="310" height="84" rx="14" class="accent"/>
    <text x="300" y="271" text-anchor="middle" class="label">더 복잡한 Feature로 조합</text>
    <text x="300" y="298" text-anchor="middle" class="small">Shape → Part → Object-level representation</text>
  </g>

  <text x="700" y="518" text-anchor="middle" class="small">이 비교는 이해를 위한 직관입니다. 인간의 시각 처리 과정과 CNN의 계산 구조가 실제로 동일하다는 뜻은 아닙니다.</text>
</svg>