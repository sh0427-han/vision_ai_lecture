<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="610" viewBox="0 0 1500 610"><rect width="100%" height="100%" fill="#fff"/><style>.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">비지도학습은 정답 없이 데이터의 구조와 낯선 패턴을 찾습니다</text>
<rect x="70" y="115" width="390" height="360" rx="20" class="soft"/><text x="265" y="153" text-anchor="middle" class="h">1. Label 없는 Data</text><text x="265" y="180" text-anchor="middle" class="s">이미지, 센서값, 로그</text>
<g transform="translate(140 210)"><circle cx="0" cy="0" r="15" fill="#60a5fa"/><circle cx="46" cy="0" r="15" fill="#60a5fa"/><circle cx="92" cy="0" r="15" fill="#60a5fa"/><circle cx="138" cy="0" r="15" fill="#60a5fa"/><circle cx="0" cy="46" r="15" fill="#60a5fa"/><circle cx="46" cy="46" r="15" fill="#60a5fa"/><circle cx="92" cy="46" r="15" fill="#f87171"/><circle cx="138" cy="46" r="15" fill="#f87171"/><circle cx="0" cy="92" r="15" fill="#f87171"/><circle cx="46" cy="92" r="15" fill="#f87171"/><circle cx="92" cy="92" r="15" fill="#f87171"/><circle cx="138" cy="92" r="15" fill="#f87171"/></g>
<path d="M480 295H580" class="arrow"/><rect x="605" y="115" width="390" height="360" rx="20" class="green"/><text x="800" y="153" text-anchor="middle" class="h">2. Structure 발견</text><text x="800" y="180" text-anchor="middle" class="s">군집 · 분포 · 표현</text>
<circle cx="700" cy="250" r="16" fill="#2563eb"/><circle cx="750" cy="290" r="16" fill="#2563eb"/><circle cx="785" cy="230" r="16" fill="#2563eb"/><circle cx="900" cy="255" r="16" fill="#ef4444"/><circle cx="940" cy="295" r="16" fill="#ef4444"/><circle cx="980" cy="235" r="16" fill="#ef4444"/>
<path d="M1020 295H1120" class="arrow"/><rect x="1145" y="115" width="285" height="360" rx="20" class="blue"/><text x="1287.5" y="153" text-anchor="middle" class="h">3. 활용</text><text x="1287.5" y="180" text-anchor="middle" class="s">군집 / 이상 점수</text>
<text x="1288" y="250" text-anchor="middle" class="h">정상 범위</text><ellipse cx="1288" cy="290" rx="78" ry="40" fill="#bbf7d0"/><circle cx="1390" cy="205" r="14" fill="#ef4444"/><text x="1390" y="180" text-anchor="middle" class="m">outlier</text>
<text x="750" y="550" text-anchor="middle" class="s">산업에서는 불량 Label이 적거나 미지의 불량을 찾고 싶을 때, 정상 Data의 분포에서 크게 벗어난 샘플을 이상 후보로 활용합니다.</text></svg>