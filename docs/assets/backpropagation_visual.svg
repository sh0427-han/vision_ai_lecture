<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#f97316"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Backpropagation은 “누가 Loss에 얼마나 영향을 줬는지” 뒤에서부터 계산합니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Forward는 값을 앞쪽으로 전달하고, Backward는 Gradient를 뒤쪽에서 앞쪽으로 전달합니다.</text>
<g font-family="Arial,sans-serif">
 <text x="70" y="160" font-size="22" font-weight="700" fill="#1d4ed8">Forward</text>
 <g text-anchor="middle" font-size="19" font-weight="700" fill="#17243b">
  <rect x="70" y="185" width="160" height="80" rx="14" fill="#eff6ff"/><text x="150" y="233">Input</text>
  <rect x="300" y="185" width="160" height="80" rx="14" fill="#eff6ff"/><text x="380" y="233">Layer 1</text>
  <rect x="530" y="185" width="160" height="80" rx="14" fill="#eff6ff"/><text x="610" y="233">Layer 2</text>
  <rect x="760" y="185" width="160" height="80" rx="14" fill="#eff6ff"/><text x="840" y="233">Prediction</text>
  <rect x="990" y="185" width="150" height="80" rx="14" fill="#fff7ed"/><text x="1065" y="233">Loss</text>
 </g>
 <g stroke="#2563eb" stroke-width="5" marker-end="url(#b)"><path d="M235 225H290"/><path d="M465 225H520"/><path d="M695 225H750"/><path d="M925 225H980"/></g>
 <text x="70" y="345" font-size="22" font-weight="700" fill="#ea580c">Backward</text>
 <g text-anchor="middle" font-size="18" fill="#7c2d12">
  <rect x="300" y="375" width="160" height="72" rx="14" fill="#fff7ed"/><text x="380" y="405">Layer 1의</text><text x="380" y="430">영향도</text>
  <rect x="530" y="375" width="160" height="72" rx="14" fill="#fff7ed"/><text x="610" y="405">Layer 2의</text><text x="610" y="430">영향도</text>
  <rect x="760" y="375" width="160" height="72" rx="14" fill="#fff7ed"/><text x="840" y="405">Prediction의</text><text x="840" y="430">영향도</text>
  <rect x="990" y="375" width="150" height="72" rx="14" fill="#ffedd5"/><text x="1065" y="418">Loss</text>
 </g>
 <g stroke="#f97316" stroke-width="5" marker-end="url(#o)"><path d="M985 411H930"/><path d="M755 411H700"/><path d="M525 411H470"/></g>
 <rect x="290" y="490" width="620" height="62" rx="14" fill="#eef6ff"/><text x="600" y="517" text-anchor="middle" font-size="19" font-weight="700" fill="#17243b">각 Weight의 Gradient를 얻으면 Optimizer가 Update할 수 있습니다.</text><text x="600" y="541" text-anchor="middle" font-size="18" fill="#64748b">수학적으로는 Chain Rule을 이용하지만, 처음에는 “영향도를 뒤에서 계산한다”로 이해하면 충분합니다.</text>
</g>
</svg>