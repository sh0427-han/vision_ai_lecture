<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Activation 없이 Linear Layer만 쌓으면 결국 큰 직선 계산 하나와 같습니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Layer 수가 늘어도 비선형성이 없으면 Decision Boundary는 여전히 Linear합니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(80 170)">
  <rect width="210" height="105" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/><text x="105" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#4338ca">Linear 1</text><text x="105" y="76" text-anchor="middle" font-size="18" fill="#64748b">W₁x + b₁</text>
  <path d="M230 52H300" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  <rect x="320" width="210" height="105" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="425" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">Linear 2</text><text x="425" y="76" text-anchor="middle" font-size="18" fill="#64748b">W₂h + b₂</text>
  <path d="M550 52H620" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
  <rect x="640" width="210" height="105" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/><text x="745" y="45" text-anchor="middle" font-size="21" font-weight="700" fill="#6d28d9">Linear 3</text><text x="745" y="76" text-anchor="middle" font-size="18" fill="#64748b">W₃h + b₃</text>
 </g>
 <text x="600" y="335" text-anchor="middle" font-size="34" font-weight="700" fill="#94a3b8">⇓</text>
 <rect x="330" y="375" width="540" height="105" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
 <text x="600" y="416" text-anchor="middle" font-size="22" font-weight="700" fill="#9a3412">결국 하나의 Linear Transformation</text>
 <text x="600" y="452" text-anchor="middle" font-size="20" fill="#9a3412">W*x + b*</text>
 <text x="600" y="535" text-anchor="middle" font-size="19" fill="#475569">→ XOR처럼 꺾이거나 휘어진 경계를 만들려면 중간에 Non-linear Activation이 필요합니다.</text>
</g>
</svg>