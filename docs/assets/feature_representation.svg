<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">모델은 입력을 Task에 유용한 숫자 표현으로 바꿉니다</text>
<rect x="70" y="130" width="230" height="190" rx="20" class="soft"/><text x="185" y="168" text-anchor="middle" class="h">Raw Input</text><text x="185" y="195" text-anchor="middle" class="s">Pixel values</text><rect x="390" y="130" width="230" height="190" rx="20" class="blue"/><text x="505" y="168" text-anchor="middle" class="h">Simple Feature</text><text x="505" y="195" text-anchor="middle" class="s">Edge / Color</text><rect x="710" y="130" width="230" height="190" rx="20" class="blue"/><text x="825" y="168" text-anchor="middle" class="h">Combined Feature</text><text x="825" y="195" text-anchor="middle" class="s">Shape / Texture</text><rect x="1030" y="130" width="400" height="190" rx="20" class="green"/><text x="1230" y="168" text-anchor="middle" class="h">Representation</text><text x="1230" y="195" text-anchor="middle" class="s">판단에 유용한 내부 숫자 표현</text>
<path d="M305 225H380" class="arrow"/><path d="M625 225H700" class="arrow"/><path d="M945 225H1020" class="arrow"/>
<text x="750" y="400" text-anchor="middle" class="h">Feature = 문제를 푸는 데 유용한 단서 · Representation = 그 단서를 담은 내부 표현</text></svg>