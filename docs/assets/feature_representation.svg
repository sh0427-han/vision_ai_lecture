<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Network는 Pixel을 그대로 외우기보다 판단에 유용한 Feature와 Representation으로 바꿉니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">아래 그림은 실제 내부 Feature Map을 그대로 복사한 것이 아니라, 학습 과정의 개념을 단순화한 예시입니다.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g transform="translate(55 155)">
  <rect width="235" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="38" font-size="21" font-weight="700" fill="#17243b">① Input</text>
  <circle cx="118" cy="160" r="72" fill="#dc2626"/><path d="M118 88 C125 55 148 48 165 55" fill="none" stroke="#713f12" stroke-width="10"/><ellipse cx="158" cy="72" rx="25" ry="12" fill="#16a34a" transform="rotate(-25 158 72)"/>
  <text x="118" y="278" font-size="18" fill="#475569">RGB Pixel</text>
 </g>
 <g transform="translate(335 155)">
  <rect width="235" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="38" font-size="21" font-weight="700" fill="#1d4ed8">② Low-level Feature</text>
  <circle cx="118" cy="160" r="72" fill="none" stroke="#2563eb" stroke-width="8"/><path d="M118 88 C125 55 148 48 165 55" fill="none" stroke="#2563eb" stroke-width="7"/><line x1="68" y1="133" x2="168" y2="133" stroke="#93c5fd" stroke-width="4"/><line x1="75" y1="185" x2="160" y2="185" stroke="#93c5fd" stroke-width="4"/>
  <text x="118" y="278" font-size="18" fill="#475569">Edge · 색 변화 · 방향</text>
 </g>
 <g transform="translate(615 155)">
  <rect width="235" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="118" y="38" font-size="21" font-weight="700" fill="#7c3aed">③ Combined Feature</text>
  <path d="M65 185 C58 105 92 80 118 78 C155 75 185 103 175 188 C160 236 75 236 65 185Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
  <path d="M118 80 C123 55 145 48 163 55" fill="none" stroke="#7c3aed" stroke-width="7"/><ellipse cx="160" cy="67" rx="23" ry="11" fill="#c4b5fd" transform="rotate(-25 160 67)"/>
  <text x="118" y="278" font-size="18" fill="#475569">둥근 형태 · 꼭지 · 부분 구조</text>
 </g>
 <g transform="translate(895 155)">
  <rect width="250" height="330" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="125" y="38" font-size="21" font-weight="700" fill="#15803d">④ Representation</text>
  <g transform="translate(38 90)">
   <rect x="0" y="105" width="18" height="35" fill="#93c5fd"/><rect x="27" y="70" width="18" height="70" fill="#60a5fa"/><rect x="54" y="20" width="18" height="120" fill="#2563eb"/><rect x="81" y="88" width="18" height="52" fill="#93c5fd"/><rect x="108" y="42" width="18" height="98" fill="#7c3aed"/><rect x="135" y="112" width="18" height="28" fill="#c4b5fd"/>
  </g>
  <text x="125" y="260" font-size="18" fill="#475569">판단에 쓰기 좋은 숫자 Vector</text>
  <text x="125" y="292" font-size="18" font-weight="700" fill="#15803d">→ Apple Class에 유용</text>
 </g>
</g>
<g stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M295 320H325"/><path d="M575 320H605"/><path d="M855 320H885"/></g>
<rect x="245" y="520" width="710" height="55" rx="12" fill="#eef6ff"/><text x="600" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17243b">Feature = 판단에 유용한 단서 · Representation = 그 단서를 담은 내부 숫자 표현</text>
</svg>