<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">Loss가 작아지는 방향으로 Weight를 반복 업데이트합니다</text>
<path d="M140 430 C300 110,520 510,700 300 C850 125,1040 485,1370 160" fill="none" stroke="#94a3b8" stroke-width="8"/><circle cx="680" cy="322" r="18" fill="#ef4444"/><path d="M680 322 L755 270" class="arrow"/><text x="770" y="260" class="m">gradient direction</text><text x="680" y="365" text-anchor="middle" class="h">current weight</text>
<rect x="80" y="105" width="240" height="130" rx="20" class="soft"/><text x="200" y="143" text-anchor="middle" class="h">Prediction</text><text x="200" y="170" text-anchor="middle" class="s">ŷ = 0.70</text><rect x="405" y="105" width="240" height="130" rx="20" class="red"/><text x="525" y="143" text-anchor="middle" class="h">Loss</text><text x="525" y="170" text-anchor="middle" class="s">정답과 차이</text><rect x="730" y="105" width="270" height="130" rx="20" class="blue"/><text x="865" y="143" text-anchor="middle" class="h">Backpropagation</text><text x="865" y="170" text-anchor="middle" class="s">각 Weight의 Gradient</text><rect x="1085" y="105" width="330" height="130" rx="20" class="green"/><text x="1250" y="143" text-anchor="middle" class="h">Optimizer</text><text x="1250" y="170" text-anchor="middle" class="s">Weight Update</text>
<path d="M325 170H395" class="arrow"/><path d="M650 170H720" class="arrow"/><path d="M1005 170H1075" class="arrow"/><text x="750" y="545" text-anchor="middle" class="h">new weight = old weight − learning rate × gradient</text></svg>