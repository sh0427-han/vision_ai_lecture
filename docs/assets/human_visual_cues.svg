<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">사람은 여러 시각 단서를 조합해 의미를 판단합니다</text>
<circle cx="375" cy="260" r="110" fill="#ef4444"/><rect x="365" y="135" width="18" height="60" rx="6" fill="#7c2d12"/><ellipse cx="417" cy="158" rx="45" ry="18" fill="#65a30d" transform="rotate(-22 417 158)"/>
<rect x="650" y="120" width="260" height="80" rx="20" class="soft"/><text x="780" y="158" text-anchor="middle" class="h">색</text><text x="780" y="185" text-anchor="middle" class="s">red color</text><rect x="650" y="220" width="260" height="80" rx="20" class="soft"/><text x="780" y="258" text-anchor="middle" class="h">윤곽</text><text x="780" y="285" text-anchor="middle" class="s">round shape</text><rect x="650" y="320" width="260" height="80" rx="20" class="soft"/><text x="780" y="358" text-anchor="middle" class="h">부분 구조</text><text x="780" y="385" text-anchor="middle" class="s">stem + leaf</text><path d="M485 235H630" class="arrow"/><path d="M485 260H630" class="arrow"/><path d="M485 285H630" class="arrow"/><rect x="1060" y="190" width="300" height="150" rx="20" class="blue"/><text x="1210" y="228" text-anchor="middle" class="h">특징 조합</text><text x="1210" y="255" text-anchor="middle" class="s">“사과 같다”</text><path d="M920 260H1050" class="arrow"/>
<text x="750" y="465" text-anchor="middle" class="s">인간의 시각 처리와 CNN의 계산 구조는 동일하지 않지만, 여러 특징을 조합한다는 직관을 제공합니다.</text></svg>