<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Data에서 운영과 Monitoring까지 반복되는 AI 개발 Cycle">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker>
</defs>
<rect width="1200" height="600" rx="28" fill="#f8fafc"/>
<text x="60" y="64" font-family="Arial, Noto Sans KR, sans-serif" font-size="30" font-weight="700" fill="#17243b">실제 AI 개발은 한 번의 Training이 아니라 반복 Cycle입니다</text>
<text x="60" y="100" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">운영에서 발견한 실패 사례를 다시 Data에 반영하면서 모델을 개선합니다.</text>

<g font-family="Arial, Noto Sans KR, sans-serif" text-anchor="middle">
  <g transform="translate(95 205)">
    <rect width="155" height="105" rx="18" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <text x="78" y="44" font-size="21" font-weight="700" fill="#1d4ed8">Data</text>
    <text x="78" y="75" font-size="17" fill="#475569">수집 · Label</text>
  </g>
  <g transform="translate(295 205)">
    <rect width="155" height="105" rx="18" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="78" y="44" font-size="21" font-weight="700" fill="#4338ca">Train</text>
    <text x="78" y="75" font-size="17" fill="#475569">Weight 학습</text>
  </g>
  <g transform="translate(495 205)">
    <rect width="155" height="105" rx="18" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="2"/>
    <text x="78" y="44" font-size="21" font-weight="700" fill="#15803d">Evaluate</text>
    <text x="78" y="75" font-size="17" fill="#475569">Val · Test</text>
  </g>
  <g transform="translate(695 205)">
    <rect width="155" height="105" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="2"/>
    <text x="78" y="44" font-size="21" font-weight="700" fill="#92400e">Deploy</text>
    <text x="78" y="75" font-size="17" fill="#475569">Inference</text>
  </g>
  <g transform="translate(895 205)">
    <rect width="155" height="105" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
    <text x="78" y="44" font-size="21" font-weight="700" fill="#be123c">Monitor</text>
    <text x="78" y="75" font-size="17" fill="#475569">실패 사례 확인</text>
  </g>
</g>

<path d="M255 258H285M455 258H485M655 258H685M855 258H885" stroke="#64748b" stroke-width="5" marker-end="url(#arr)"/>
<path d="M972 325 C970 470 170 470 170 325" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#arr)"/>
<text x="600" y="435" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" font-weight="700" fill="#2563eb">운영에서 모은 실패 사례 → 다음 Data</text>
<text x="600" y="480" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="18" fill="#64748b">Preprocessing 규칙과 평가 기준도 Version과 함께 관리하면 재현성이 좋아집니다.</text>
</svg>