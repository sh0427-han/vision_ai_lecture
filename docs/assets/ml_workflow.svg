<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
<rect width="1400" height="500" fill="#fff"/>
<style>.t{font:700 30px Arial;fill:#111827}.l{font:700 17px Arial;fill:#111827}.s{font:400 13px Arial;fill:#64748b}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.a{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.arrow{stroke:#64748b;stroke-width:3;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="700" y="45" text-anchor="middle" class="t">실제 머신러닝은 ‘모델 학습’만으로 끝나지 않습니다</text>
<g transform="translate(45 150)">
<g><rect width="180" height="105" rx="16" class="box"/><text x="90" y="42" text-anchor="middle" class="l">1. 수집</text><text x="90" y="70" text-anchor="middle" class="s">Acquisition</text></g>
<path d="M180 53 L220 53" class="arrow"/>
<g transform="translate(225)"><rect width="180" height="105" rx="16" class="box"/><text x="90" y="42" text-anchor="middle" class="l">2. 탐색</text><text x="90" y="70" text-anchor="middle" class="s">Inspection / EDA</text></g>
<path d="M405 53 L445 53" class="arrow"/>
<g transform="translate(450)"><rect width="180" height="105" rx="16" class="box"/><text x="90" y="42" text-anchor="middle" class="l">3. 전처리</text><text x="90" y="70" text-anchor="middle" class="s">Cleaning</text></g>
<path d="M630 53 L670 53" class="arrow"/>
<g transform="translate(675)"><rect width="180" height="105" rx="16" class="a"/><text x="90" y="42" text-anchor="middle" class="l">4. 학습</text><text x="90" y="70" text-anchor="middle" class="s">Training</text></g>
<path d="M855 53 L895 53" class="arrow"/>
<g transform="translate(900)"><rect width="180" height="105" rx="16" class="box"/><text x="90" y="42" text-anchor="middle" class="l">5. 평가</text><text x="90" y="70" text-anchor="middle" class="s">Evaluation</text></g>
<path d="M1080 53 L1120 53" class="arrow"/>
<g transform="translate(1125)"><rect width="180" height="105" rx="16" class="box"/><text x="90" y="42" text-anchor="middle" class="l">6. 배포</text><text x="90" y="70" text-anchor="middle" class="s">Deployment</text></g>
</g>
<text x="700" y="350" text-anchor="middle" class="l">Vision AI에서 데이터 수집·라벨·전처리·평가 설계가 모델 구조만큼 중요한 이유입니다.</text>
<text x="700" y="385" text-anchor="middle" class="s">현장 배포 뒤에는 모니터링과 데이터 재수집이 이어지므로 실제 과정은 반복적인 Cycle에 가깝습니다.</text>
</svg>