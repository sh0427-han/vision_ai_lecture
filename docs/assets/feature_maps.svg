<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Kernel 하나가 Feature Map 하나를 만들고, 여러 Map이 Channel로 쌓입니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">RGB 입력의 한 Kernel은 공간 3 × 3뿐 아니라 R/G/B Channel 전체를 함께 봅니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(55 165)">
  <text x="110" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#17243b">Input</text>
  <g transform="translate(20 30)">
   <rect x="30" y="0" width="150" height="180" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
   <rect x="15" y="15" width="150" height="180" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
   <rect x="0" y="30" width="150" height="180" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
   <text x="75" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">RGB</text>
  </g>
  <text x="110" y="275" text-anchor="middle" font-size="18" fill="#475569">224 × 224 × 3</text>
 </g>
 <path d="M285 285H345" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
 <g transform="translate(370 150)">
  <text x="150" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Learned Kernels</text>
  <g transform="translate(10 40)">
   <rect width="95" height="95" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="48" y="55" text-anchor="middle" font-size="18" fill="#1d4ed8">Kernel 1</text>
   <rect x="105" y="35" width="95" height="95" rx="12" fill="#eef2ff" stroke="#a5b4fc"/><text x="153" y="90" text-anchor="middle" font-size="18" fill="#4338ca">Kernel 2</text>
   <rect x="210" y="70" width="95" height="95" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/><text x="258" y="125" text-anchor="middle" font-size="18" fill="#6d28d9">...</text>
  </g>
  <text x="150" y="260" text-anchor="middle" font-size="18" fill="#475569">예: 64개 Kernel</text>
  <text x="150" y="290" text-anchor="middle" font-size="18" fill="#475569">각 Kernel: 3 × 3 × 3</text>
 </g>
 <path d="M690 285H750" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
 <g transform="translate(775 145)">
  <text x="175" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#15803d">Output Feature Maps</text>
  <g transform="translate(35 35)">
   <rect x="45" y="0" width="190" height="190" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
   <path d="M75 30L205 160M75 160L205 30" stroke="#475569" stroke-width="10" opacity=".55"/>
   <rect x="25" y="20" width="190" height="190" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" opacity=".9"/>
   <path d="M55 55H185M55 100H185M55 145H185" stroke="#2563eb" stroke-width="8" opacity=".45"/>
   <rect x="5" y="40" width="190" height="190" rx="12" fill="#dcfce7" stroke="#4ade80" stroke-width="2" opacity=".78"/>
   <circle cx="100" cy="135" r="55" fill="none" stroke="#15803d" stroke-width="10" opacity=".55"/>
  </g>
  <text x="175" y="300" text-anchor="middle" font-size="18" fill="#475569">224 × 224 × 64</text>
  <text x="175" y="330" text-anchor="middle" font-size="18" fill="#475569">64 Maps = 64 Channels</text>
 </g>
 <rect x="230" y="515" width="740" height="52" rx="12" fill="#fff7ed"/>
 <text x="600" y="547" text-anchor="middle" font-size="18" fill="#9a3412">각 Channel이 반드시 사람이 이름 붙일 수 있는 “Edge/Texture” 하나와 정확히 대응하는 것은 아닙니다.</text>
</g>
</svg>