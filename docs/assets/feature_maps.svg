<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="550" viewBox="0 0 1500 550"><rect width="100%" height="100%" fill="#fff"/>
<style>
.t{font:700 29px Arial,sans-serif;fill:#0f172a}.h{font:700 22px Arial,sans-serif;fill:#0f172a}.m{font:700 16px Arial,sans-serif;fill:#2563eb}.s{font:400 16px Arial,sans-serif;fill:#64748b}.xs{font:600 13px Arial,sans-serif;fill:#475569}.n{font:700 18px monospace;fill:#334155}.box{fill:#fff;stroke:#dbe2ea;stroke-width:2}.blue{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.green{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.red{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.soft{fill:#f8fafc;stroke:#dbe2ea;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
<text x="750" y="48" text-anchor="middle" class="t">여러 Filter는 서로 다른 Feature Map을 만들고, 이것이 Channel 축으로 쌓입니다</text>
<rect x="70" y="130" width="310" height="270" rx="20" class="soft"/><text x="225" y="168" text-anchor="middle" class="h">Input</text><text x="225" y="195" text-anchor="middle" class="s">224 × 224 × 3</text><rect x="150" y="210" width="110" height="110" fill="#fecaca"/><rect x="165" y="195" width="110" height="110" fill="#bbf7d0" opacity=".85"/><rect x="180" y="180" width="110" height="110" fill="#bfdbfe" opacity=".8"/>
<path d="M400 260H520" class="arrow"/><rect x="545" y="130" width="270" height="270" rx="20" class="blue"/><text x="680" y="168" text-anchor="middle" class="h">64 Filters</text><text x="680" y="195" text-anchor="middle" class="s">각각 다른 패턴</text><text x="680" y="255" text-anchor="middle" class="h">Conv</text>
<path d="M835 260H955" class="arrow"/><rect x="980" y="130" width="390" height="270" rx="20" class="green"/><text x="1175" y="168" text-anchor="middle" class="h">Feature Map Stack</text><text x="1175" y="195" text-anchor="middle" class="s">224 × 224 × 64</text>
<rect x="1080" y="205" width="145" height="145" fill="#dbeafe" opacity=".9" stroke="#2563eb"/><rect x="1107" y="188" width="145" height="145" fill="#bfdbfe" opacity=".9" stroke="#2563eb"/><rect x="1134" y="171" width="145" height="145" fill="#93c5fd" opacity=".9" stroke="#2563eb"/><rect x="1161" y="154" width="145" height="145" fill="#60a5fa" opacity=".9" stroke="#2563eb"/><text x="1175" y="390" text-anchor="middle" class="s">Map 1 · Map 2 · … · Map 64</text>
<text x="750" y="500" text-anchor="middle" class="h">Channel = 서로 다른 Feature Map을 쌓아 놓은 축</text></svg>