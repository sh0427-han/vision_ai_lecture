<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Training은 Weight를 바꾸고, Inference는 학습된 Weight를 그대로 사용합니다</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(60 130)">
  <rect width="1080" height="190" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="25" y="38" font-size="24" font-weight="700" fill="#1d4ed8">Training · 학습할 때</text>
  <g text-anchor="middle" font-size="18" font-weight="700" fill="#17243b">
   <rect x="25" y="72" width="145" height="72" rx="12" fill="#fff"/><text x="98" y="102">Image + Label</text>
   <rect x="220" y="72" width="125" height="72" rx="12" fill="#fff"/><text x="283" y="114">Model</text>
   <rect x="395" y="72" width="125" height="72" rx="12" fill="#fff"/><text x="458" y="114">Prediction</text>
   <rect x="570" y="72" width="125" height="72" rx="12" fill="#fff7ed"/><text x="633" y="114">Loss</text>
   <rect x="745" y="72" width="125" height="72" rx="12" fill="#fff1f2"/><text x="808" y="114">Backward</text>
   <rect x="920" y="72" width="135" height="72" rx="12" fill="#ecfdf5"/><text x="988" y="102">Weight</text><text x="988" y="126">Update</text>
  </g>
  <g stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M175 108H210"/><path d="M350 108H385"/><path d="M525 108H560"/><path d="M700 108H735"/><path d="M875 108H910"/></g>
 </g>
 <g transform="translate(60 350)">
  <rect width="1080" height="170" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
