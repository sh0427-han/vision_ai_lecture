<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
<rect width="1500" height="650" fill="#fff"/>
<style>
.t{font:700 30px Arial,sans-serif;fill:#111827}
.h{font:700 21px Arial,sans-serif;fill:#111827}
.s{font:400 15px Arial,sans-serif;fill:#64748b}
.card{fill:#fff;stroke:#dbe2ea;stroke-width:2}
.img{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
.bb{fill:none;stroke:#2563eb;stroke-width:5}
.mask{fill:#60a5fa;opacity:.45}
.def{fill:#ef4444}
.tag{font:700 13px Arial,sans-serif;fill:#2563eb}
</style>
<text x="750" y="48" text-anchor="middle" class="t">같은 이미지, 서로 다른 Vision Task</text>

<g transform="translate(115 110)">
<rect width="380" height="440" rx="22" class="card"/>
<text x="190" y="42" text-anchor="middle" class="h">Classification</text>
<text x="190" y="70" text-anchor="middle" class="s">이미지 전체가 무엇인가?</text>
<g transform="translate(65 100)">
  <rect width="250" height="210" rx="14" class="img"/>
  <rect x="45" y="58" width="160" height="95" rx="14" fill="#94a3b8"/>
  <circle cx="192" cy="72" r="13" class="def"/>
</g>
<text x="190" y="355" text-anchor="middle" class="tag">OUTPUT</text>
<text x="190" y="388" text-anchor="middle" class="h">Abnormal 97%</text>
<text x="190" y="418" text-anchor="middle" class="s">Class / Probability</text>
</g>

<g transform="translate(560 110)">
<rect width="380" height="440" rx="22" class="card"/>
<text x="190" y="42" text-anchor="middle" class="h">Object Detection</text>
<text x="190" y="70" text-anchor="middle" class="s">무엇이 어디에 있는가?</text>
<g transform="translate(65 100)">
  <rect width="250" height="210" rx="14" class="img"/>
  <rect x="45" y="58" width="160" height="95" rx="14" fill="#94a3b8"/>
  <circle cx="192" cy="72" r="13" class="def"/>
  <rect x="172" y="51" width="42" height="42" class="bb"/>
</g>
<text x="190" y="355" text-anchor="middle" class="tag">OUTPUT</text>
<text x="190" y="388" text-anchor="middle" class="h">Defect + Bounding Box</text>
<text x="190" y="418" text-anchor="middle" class="s">Class + Position</text>
</g>

<g transform="translate(1005 110)">
<rect width="380" height="440" rx="22" class="card"/>
<text x="190" y="42" text-anchor="middle" class="h">Segmentation</text>
<text x="190" y="70" text-anchor="middle" class="s">정확히 어느 Pixel인가?</text>
<g transform="translate(65 100)">
  <rect width="250" height="210" rx="14" class="img"/>
  <rect x="45" y="58" width="160" height="95" rx="14" fill="#94a3b8"/>
  <circle cx="192" cy="72" r="13" class="def"/>
  <circle cx="192" cy="72" r="20" class="mask"/>
</g>
<text x="190" y="355" text-anchor="middle" class="tag">OUTPUT</text>
<text x="190" y="388" text-anchor="middle" class="h">Defect Mask</text>
<text x="190" y="418" text-anchor="middle" class="s">Pixel-level Area / Shape</text>
</g>

<text x="750" y="605" text-anchor="middle" class="h">Classification = What · Detection = What + Where · Segmentation = Which Pixels</text>
</svg>