<text x="750" y="48" text-anchor="middle" class="t">같은 사과 검사 이미지도 필요한 Output에 따라 Task가 달라집니다</text>
<g><rect x="95" y="100" width="390" height="455" rx="22" class="box"/><text x="290" y="143" text-anchor="middle" class="h">Classification</text><text x="290" y="170" text-anchor="middle" class="s">이미지 전체가 정상인가?</text><image href="vision_task_apple_reference.jpg" x="155" y="200" width="270" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#c1)"/><rect x="155" y="200" width="270" height="180" rx="14" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="290" y="435" text-anchor="middle" class="m">OUTPUT</text><text x="290" y="478" text-anchor="middle" class="h">Abnormal 0.98</text><text x="290" y="510" text-anchor="middle" class="s">Class / Probability</text></g>
<g><rect x="555" y="100" width="390" height="455" rx="22" class="box"/><text x="750" y="143" text-anchor="middle" class="h">Object Detection</text><text x="750" y="170" text-anchor="middle" class="s">불량이 어디에 있는가?</text><image href="vision_task_apple_reference.jpg" x="615" y="200" width="270" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#c2)"/><rect x="767" y="249" width="48" height="48" rx="4" fill="none" stroke="#2563eb" stroke-width="5"/><rect x="767" y="225" width="74" height="20" rx="5" fill="#2563eb"/><text x="804" y="240" text-anchor="middle" class="tag">defect</text><rect x="615" y="200" width="270" height="180" rx="14" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="750" y="435" text-anchor="middle" class="m">OUTPUT</text><text x="750" y="478" text-anchor="middle" class="h">Defect + Box</text><text x="750" y="510" text-anchor="middle" class="s">Class + Position</text></g>
<g><rect x="1015" y="100" width="390" height="455" rx="22" class="box"/><text x="1210" y="143" text-anchor="middle" class="h">Segmentation</text><text x="1210" y="170" text-anchor="middle" class="s">정확히 어느 Pixel인가?</text><image href="vision_task_apple_reference.jpg" x="1075" y="200" width="270" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#c3)"/><path d="M1238 263 C1250 242,1278 245,1285 265 C1293 288,1278 309,1254 308 C1233 302,1227 281,1238 263Z" fill="#60a5fa" opacity=".58" stroke="#2563eb" stroke-width="3"/><rect x="1075" y="200" width="270" height="180" rx="14" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="1210" y="435" text-anchor="middle" class="m">OUTPUT</text><text x="1210" y="478" text-anchor="middle" class="h">Defect Mask</text><text x="1210" y="510" text-anchor="middle" class="s">Pixel-level Area / Shape</text></g>
