<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">정답 Label이 있으면 관계를 배우고, 없으면 데이터 구조를 찾습니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">위: 실제 입력 예시 · 아래: 학습된 Feature Space를 단순화한 모습</text>
<g font-family="Arial,sans-serif">
  <g transform="translate(55 130)">
    <rect width="520" height="405" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="25" y="40" font-size="23" font-weight="700" fill="#1d4ed8">Supervised Learning · 지도학습</text>
    <g transform="translate(35 70)">
      <rect width="110" height="74" rx="12" fill="#dbeafe"/><text x="55" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Image A</text><text x="55" y="58" text-anchor="middle" font-size="18" fill="#1e3a8a">Label: Apple</text>
      <rect x="135" width="110" height="74" rx="12" fill="#ffedd5"/><text x="190" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">Image B</text><text x="190" y="58" text-anchor="middle" font-size="18" fill="#9a3412">Label: Orange</text>
      <path d="M270 36H335" stroke="#64748b" stroke-width="4"/><path d="M335 36l-12-8v16z" fill="#64748b"/>
      <rect x="350" width="115" height="74" rx="12" fill="#ecfdf5"/><text x="408" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#15803d">Model learns</text>
    </g>
    <g transform="translate(35 185)">
      <rect width="450" height="170" rx="12" fill="#fff" stroke="#d8e1ed"/>
      <line x1="45" y1="135" x2="420" y2="135" stroke="#94a3b8" stroke-width="2"/><line x1="45" y1="135" x2="45" y2="25" stroke="#94a3b8" stroke-width="2"/>
      <path d="M95 120 C165 102 225 82 300 45 C340 27 380 20 410 18" fill="none" stroke="#334155" stroke-width="3"/>
      <g fill="#2563eb"><circle cx="90" cy="115" r="8"/><circle cx="125" cy="100" r="8"/><circle cx="160" cy="110" r="8"/><circle cx="205" cy="82" r="8"/></g>
      <g fill="#f59e0b"><circle cx="250" cy="55" r="8"/><circle cx="295" cy="42" r="8"/><circle cx="345" cy="55" r="8"/><circle cx="382" cy="35" r="8"/></g>
      <text x="278" y="104" font-size="18" fill="#334155">Decision boundary</text>
    </g>
    <text x="260" y="385" text-anchor="middle" font-size="18" fill="#475569">Label을 이용해 “어떤 입력이 어떤 정답인가?”를 학습</text>
  </g>
  <g transform="translate(625 130)">
    <rect width="520" height="405" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="25" y="40" font-size="23" font-weight="700" fill="#7c3aed">Unsupervised Learning · 비지도학습</text>
    <g transform="translate(35 70)">
      <rect width="110" height="74" rx="12" fill="#f1f5f9"/><text x="55" y="45" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">Image 1</text>
      <rect x="135" width="110" height="74" rx="12" fill="#f1f5f9"/><text x="190" y="45" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">Image 2</text>
      <path d="M270 36H335" stroke="#64748b" stroke-width="4"/><path d="M335 36l-12-8v16z" fill="#64748b"/>
      <rect x="350" width="115" height="74" rx="12" fill="#f5f3ff"/><text x="408" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">No Label</text><text x="408" y="58" text-anchor="middle" font-size="18" fill="#6d28d9">find structure</text>
    </g>
    <g transform="translate(35 185)">
      <rect width="450" height="170" rx="12" fill="#fff" stroke="#d8e1ed"/>
