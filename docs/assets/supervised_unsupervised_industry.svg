<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Supervised learning and unsupervised learning comparison in paper-style feature space plots">
<rect width="1200" height="600" fill="#ffffff"/>
<text x="60" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17243b">Learning from labeled targets vs discovering structure without labels</text>
<text x="60" y="91" font-family="Arial, sans-serif" font-size="17" fill="#64748b">Schematic feature-space view</text>

<g transform="translate(55,130)" font-family="Arial, sans-serif">
  <text x="0" y="0" font-size="20" font-weight="700" fill="#17243b">(a) Supervised Learning</text>
  <text x="0" y="28" font-size="17" fill="#64748b">Each sample is paired with a target label.</text>
  <rect x="0" y="52" width="510" height="350" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="56" y1="350" x2="470" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="56" y1="350" x2="56" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="435" y="382" font-size="16" fill="#64748b">Feature 1</text>
  <text x="15" y="100" font-size="16" fill="#64748b" transform="rotate(-90 15 100)">Feature 2</text>
  <path d="M105 310 C180 270 240 230 300 180 C350 140 405 120 455 110" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="295" y="118" font-size="16" fill="#334155">decision boundary</text>

  <g fill="#2563eb" stroke="#ffffff" stroke-width="1.5">
    <circle cx="110" cy="300" r="9"/><circle cx="145" cy="275" r="9"/><circle cx="176" cy="296" r="9"/><circle cx="195" cy="250" r="9"/>
    <circle cx="225" cy="265" r="9"/><circle cx="245" cy="220" r="9"/><circle cx="275" cy="235" r="9"/><circle cx="305" cy="195" r="9"/>
  </g>
  <g fill="#d97706" stroke="#ffffff" stroke-width="1.5">
    <circle cx="225" cy="160" r="9"/><circle cx="265" cy="145" r="9"/><circle cx="300" cy="120" r="9"/><circle cx="335" cy="145" r="9"/>
    <circle cx="365" cy="118" r="9"/><circle cx="390" cy="155" r="9"/><circle cx="420" cy="130" r="9"/><circle cx="440" cy="175" r="9"/>
  </g>
  <g font-size="16" fill="#334155">
    <circle cx="90" cy="26" r="7" fill="#2563eb"/><text x="104" y="31">Class A</text>
    <circle cx="180" cy="26" r="7" fill="#d97706"/><text x="194" y="31">Class B</text>
  </g>
  <rect x="82" y="365" width="350" height="28" rx="5" fill="#eff6ff"/>
  <text x="257" y="384" text-anchor="middle" font-size="16" fill="#1e3a8a">Known label → learn mapping from x to y</text>
</g>

<g transform="translate(635,130)" font-family="Arial, sans-serif">
  <text x="0" y="0" font-size="20" font-weight="700" fill="#17243b">(b) Unsupervised Learning</text>
  <text x="0" y="28" font-size="17" fill="#64748b">Only input samples are given; structure is inferred from the data.</text>
  <rect x="0" y="52" width="510" height="350" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="56" y1="350" x2="470" y2="350" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="56" y1="350" x2="56" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="435" y="382" font-size="16" fill="#64748b">Feature 1</text>
  <text x="15" y="100" font-size="16" fill="#64748b" transform="rotate(-90 15 100)">Feature 2</text>

  <ellipse cx="160" cy="250" rx="78" ry="58" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <ellipse cx="340" cy="160" rx="84" ry="60" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <ellipse cx="355" cy="290" rx="72" ry="48" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <g fill="#475569">
    <circle cx="115" cy="235" r="8"/><circle cx="138" cy="270" r="8"/><circle cx="165" cy="225" r="8"/><circle cx="188" cy="252" r="8"/><circle cx="205" cy="278" r="8"/>
    <circle cx="295" cy="150" r="8"/><circle cx="320" cy="125" r="8"/><circle cx="345" cy="170" r="8"/><circle cx="372" cy="140" r="8"/><circle cx="397" cy="180" r="8"/>
    <circle cx="315" cy="282" r="8"/><circle cx="345" cy="305" r="8"/><circle cx="372" cy="280" r="8"/><circle cx="397" cy="305" r="8"/>
  </g>
  <text x="158" y="185" text-anchor="middle" font-size="16" fill="#2563eb">cluster 1</text>
  <text x="340" y="92" text-anchor="middle" font-size="16" fill="#d97706">cluster 2</text>
  <text x="355" y="352" text-anchor="middle" font-size="16" fill="#475569">cluster 3</text>
  <rect x="82" y="365" width="350" height="28" rx="5" fill="#f8fafc"/>
  <text x="257" y="384" text-anchor="middle" font-size="16" fill="#334155">No target label → discover groups / representation</text>
</g>
</svg>