      <g fill="#475569"><circle cx="85" cy="93" r="8"/><circle cx="118" cy="70" r="8"/><circle cx="145" cy="105" r="8"/><circle cx="282" cy="52" r="8"/><circle cx="315" cy="39" r="8"/><circle cx="342" cy="68" r="8"/><circle cx="305" cy="126" r="8"/><circle cx="344" cy="118" r="8"/><circle cx="365" cy="137" r="8"/></g>
      <text x="115" y="30" font-size="18" fill="#2563eb">Cluster</text><text x="290" y="25" font-size="18" fill="#d97706">Cluster</text><text x="345" y="165" font-size="18" fill="#7c3aed">Cluster</text>
    </g>
    <text x="260" y="385" text-anchor="middle" font-size="18" fill="#475569">정답 없이 “어떤 데이터가 서로 비슷한가?”를 탐색</text>
  </g>
</g>
</svg>