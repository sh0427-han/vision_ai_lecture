<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Perceptron 여러 개를 한 줄로 모으면 Layer, Layer를 연결하면 Neural Network가 됩니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">각 Node는 앞 Layer의 값을 받아 새로운 숫자를 계산합니다.</text>
