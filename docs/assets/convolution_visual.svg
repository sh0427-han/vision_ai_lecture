<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">Convolution 한 칸은 “Patch × Kernel → 곱하고 더하기”로 계산됩니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">설명을 위해 단일 Channel의 3 × 3 Patch만 보겠습니다. 실제 RGB 입력에서는 Channel 방향까지 함께 계산합니다.</text>
<g font-family="Arial,sans-serif">
 <g transform="translate(65 150)">
  <text x="105" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#17243b">Image Patch</text>
  <g transform="translate(0 30)" text-anchor="middle" font-size="20" fill="#334155">
   <rect width="70" height="70" fill="#f8fafc" stroke="#cbd5e1"/><rect x="70" width="70" height="70" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="140" width="70" height="70" fill="#cbd5e1" stroke="#cbd5e1"/>
   <rect y="70" width="70" height="70" fill="#f8fafc" stroke="#cbd5e1"/><rect x="70" y="70" width="70" height="70" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="140" y="70" width="70" height="70" fill="#cbd5e1" stroke="#cbd5e1"/>
   <rect y="140" width="70" height="70" fill="#f8fafc" stroke="#cbd5e1"/><rect x="70" y="140" width="70" height="70" fill="#e2e8f0" stroke="#cbd5e1"/><rect x="140" y="140" width="70" height="70" fill="#cbd5e1" stroke="#cbd5e1"/>
   <text x="35" y="43">0</text><text x="105" y="43">0</text><text x="175" y="43">1</text>
   <text x="35" y="113">0</text><text x="105" y="113">0</text><text x="175" y="113">1</text>
   <text x="35" y="183">0</text><text x="105" y="183">0</text><text x="175" y="183">1</text>
  </g>
 </g>
 <text x="315" y="285" font-size="34" fill="#94a3b8">×</text>
 <g transform="translate(365 150)">
  <text x="105" y="0" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">Kernel</text>
  <g transform="translate(0 30)" text-anchor="middle" font-size="20" font-weight="700">
   <rect width="70" height="70" fill="#eff6ff" stroke="#93c5fd"/><rect x="70" width="70" height="70" fill="#fff" stroke="#93c5fd"/><rect x="140" width="70" height="70" fill="#dbeafe" stroke="#93c5fd"/>
   <rect y="70" width="70" height="70" fill="#eff6ff" stroke="#93c5fd"/><rect x="70" y="70" width="70" height="70" fill="#fff" stroke="#93c5fd"/><rect x="140" y="70" width="70" height="70" fill="#dbeafe" stroke="#93c5fd"/>
   <rect y="140" width="70" height="70" fill="#eff6ff" stroke="#93c5fd"/><rect x="70" y="140" width="70" height="70" fill="#fff" stroke="#93c5fd"/><rect x="140" y="140" width="70" height="70" fill="#dbeafe" stroke="#93c5fd"/>
   <text x="35" y="43" fill="#1d4ed8">-1</text><text x="105" y="43" fill="#475569">0</text><text x="175" y="43" fill="#1d4ed8">1</text>
   <text x="35" y="113" fill="#1d4ed8">-1</text><text x="105" y="113" fill="#475569">0</text><text x="175" y="113" fill="#1d4ed8">1</text>
   <text x="35" y="183" fill="#1d4ed8">-1</text><text x="105" y="183" fill="#475569">0</text><text x="175" y="183" fill="#1d4ed8">1</text>
  </g>
 </g>
 <path d="M600 285H690" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/>
 <g transform="translate(720 175)">
  <rect width="410" height="210" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="205" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#17243b">Element-wise multiply + sum</text>
  <text x="205" y="92" text-anchor="middle" font-size="19" fill="#475569">0×(-1) + 0×0 + 1×1</text>
  <text x="205" y="125" text-anchor="middle" font-size="19" fill="#475569">+ 같은 계산을 세 행에 반복</text>
  <rect x="135" y="150" width="140" height="42" rx="10" fill="#dcfce7"/><text x="205" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#15803d">Output = 3</text>
 </g>
 <rect x="205" y="455" width="790" height="70" rx="14" fill="#eef6ff"/>
 <text x="600" y="486" text-anchor="middle" font-size="20" font-weight="700" fill="#17243b">이 계산을 같은 Kernel로 오른쪽·아래 위치에 반복</text>
 <text x="600" y="514" text-anchor="middle" font-size="18" fill="#53647b">→ 위치마다 하나의 반응값이 생기고, 모이면 Feature Map이 됩니다.</text>
</g>
</svg>