<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="55" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17243b">CNN도 AI Basics에서 배운 Training Loop와 같은 원리로 Weight를 학습합니다</text>
<text x="55" y="90" font-family="Arial,sans-serif" font-size="18" fill="#64748b">차이는 Model 내부에 Convolution Kernel 같은 Vision용 Parameter가 있다는 점입니다.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <g transform="translate(55 170)"><rect width="180" height="135" rx="18" fill="#eef2ff" stroke="#c7d2fe"/><text x="90" y="40" font-size="21" font-weight="700" fill="#4338ca">Image + Label</text><text x="90" y="78" font-size="18" fill="#475569">학습 Input</text><text x="90" y="106" font-size="18" fill="#475569">정답 Target</text></g>
 <g transform="translate(285 170)"><rect width="180" height="135" rx="18" fill="#eff6ff" stroke="#bfdbfe"/><text x="90" y="40" font-size="21" font-weight="700" fill="#1d4ed8">CNN Forward</text><text x="90" y="78" font-size="18" fill="#475569">Kernel로 Feature</text><text x="90" y="106" font-size="18" fill="#475569">→ Prediction</text></g>
 <g transform="translate(515 170)"><rect width="180" height="135" rx="18" fill="#fff7ed" stroke="#fed7aa"/><text x="90" y="40" font-size="21" font-weight="700" fill="#9a3412">Loss</text><text x="90" y="78" font-size="18" fill="#475569">Prediction</text><text x="90" y="106" font-size="18" fill="#475569">↔ Label</text></g>
 <g transform="translate(745 170)"><rect width="180" height="135" rx="18" fill="#fff1f2" stroke="#fecdd3"/><text x="90" y="40" font-size="21" font-weight="700" fill="#be123c">Backward</text><text x="90" y="78" font-size="18" fill="#475569">Kernel Weight의</text><text x="90" y="106" font-size="18" fill="#475569">Gradient 계산</text></g>
 <g transform="translate(975 170)"><rect width="170" height="135" rx="18" fill="#ecfdf5" stroke="#bbf7d0"/><text x="85" y="40" font-size="21" font-weight="700" fill="#15803d">Optimizer</text><text x="85" y="78" font-size="18" fill="#475569">Kernel / Layer</text><text x="85" y="106" font-size="18" fill="#475569">Weight Update</text></g>
</g>
<g stroke="#64748b" stroke-width="4" marker-end="url(#a)"><path d="M240 237H275"/><path d="M470 237H505"/><path d="M700 237H735"/><path d="M930 237H965"/><path d="M1060 320C1060 440 375 440 375 320"/></g>
<rect x="280" y="460" width="640" height="70" rx="14" fill="#eef6ff"/>
<text x="600" y="489" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17243b">Kernel 값도 사람이 고정하는 규칙이 아니라 학습되는 Parameter</text>
<text x="600" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#53647b">Inference에서는 학습된 Weight를 고정하고 Forward만 수행합니다.</text>
</svg>